; Ajustes de PHP para o serviço de relatórios.
;
; O default de 128M não sustenta a geração de PDF: o dompdf monta uma árvore
; de frames e um cellmap da tabela inteira antes de paginar, e o consumo cresce
; de forma superlinear com o número de linhas. Medido neste projeto:
;
;     500 linhas ->   184 MB, 9,6s
;   1.000 linhas ->   420 MB, 17,9s
;   2.000 linhas -> 1.164 MB, 56,5s
;   3.500 linhas -> 2.965 MB, 210s
;
; 512M com teto de 1.000 linhas deixa margem. Acima disso a resposta é 422
; apontando o CSV, que faz streaming e não tem limite.
memory_limit = 512M

; O default de 30s derrubava a geração antes mesmo da memória acabar.
max_execution_time = 120

; pcov desligado por padrão: ele instrumenta o código e não deve pesar na
; execução normal. Habilitar só ao gerar cobertura:
;   docker compose exec php php -d pcov.enabled=1 artisan test --coverage
pcov.enabled = 0
pcov.directory = /var/www/html/app

; O PHP anuncia a própria versão no cabeçalho `X-Powered-By` de toda resposta.
; Não é vulnerabilidade, é reconhecimento gratuito: dizer "PHP 8.3.33" poupa a
; quem sonda o trabalho de descobrir qual CVE tentar.
expose_php = Off
