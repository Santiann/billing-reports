# API specification — OpenAPI 3.1
#
# This file is written by hand and verified by a test. `OpenApiSpecTest` compares
# the operations here against the routes registered in Laravel in BOTH directions:
# a route with no entry fails, and an entry with no route fails too. Hand-written
# API documentation rots in silence, and that silence is what the test removes.
#
# The examples were not invented: they came from real calls to the API, with the
# values checked against InterestCalculator.

openapi: 3.1.0

info:
  title: Billing Reports — billing API
  version: "1.0.0"
  summary: Billings, customers and a report with compound interest on arrears.
  description: |
    The REST API of the billing report generator. It covers creating customers,
    creating and paying billings, and the billing report with its exports.

    ## Authentication

    A Sanctum token in the `Authorization: Bearer <token>` header, obtained from
    `POST /api/auth/login`. Every route requires the token, except the login
    itself.

    In the web application the token never reaches the browser: Next.js keeps it
    in an httpOnly cookie and talks to this API from the server.

    ## The interest rule

    A billing past its due date and unpaid accrues **compound interest**:

        updated_amount = original_amount * (1 + monthly_rate) ^ (days_late / 30)

    Three consequences show up in the responses:

    - `interest_amount` and `updated_amount` arrive computed by the backend on
      every listing and on every single billing, always by the same rule.
    - A **paid billing accrues no interest**. The interest freezes at the payment
      date, and `paid_amount` and `paid_interest_amount` hold that day's value —
      never a recompute.
    - "Overdue" is not a stored status: it is `status = pending` with the due date
      in the past, and it arrives as the boolean `is_overdue`.

    ## Monetary amounts are strings

    Every money field travels as a decimal string (`"1534.05"`), not as a number.
    In JSON a number is a double-precision float, and the report sums millions of
    rows: the cent is lost in serialisation before it even reaches the screen.
  contact:
    name: João Santian
    email: joaosantian1@gmail.com

servers:
  - url: http://localhost:8000
    description: The Docker Compose environment

security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: Login, logout and the current session.
  - name: Dashboard
    description: The current month's indicators and the last twelve months' series.
  - name: Customers
    description: Customer records. The document is a CPF or CNPJ, digits only.
  - name: Billings
    description: Creating, editing and recording a payment.
  - name: Operations
    description: Health check for monitoring.
  - name: Report
    description: |
      The billing report by period, with totals over the whole filtered set —
      never over the page on display — and exports to CSV and PDF.

paths:
  # ------------------------------------------------------------- operação ---

  /api/health:
    get:
      tags: [Operations]
      summary: Health check of the dependencies
      description: |
        Public, because a monitoring probe does not log in.

        It answers **200** with `status: ok` when every dependency answers, and
        **503** with `status: degraded` when one fails — naming the one that
        failed and the error's message. A health check that always answers 200 is
        worse than none: the monitoring starts trusting it and stops warning.

        The cache check is a **read**. Writing would prove more and would cost one
        commit per probe: with the database driver, every write goes to disk.

        Laravel's `/up` still exists and answers a different question — whether
        PHP came up. This route answers whether the dependencies are standing.
      operationId: health
      security: []
      responses:
        200:
          description: Every dependency answered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  checks:
                    type: object
              example:
                status: ok
                checks:
                  database:
                    ok: true
                    duration_ms: 1.14
                  cache:
                    ok: true
                    duration_ms: 0.42
        503:
          description: One of the dependencies did not answer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  checks:
                    type: object
              example:
                status: degraded
                checks:
                  database:
                    ok: false
                    error: 'SQLSTATE[HY000] [2002] Connection refused'
                  cache:
                    ok: true
                    duration_ms: 0.39

  # ----------------------------------------------------------------- auth ---

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticates and returns a token
      description: |
        Wrong credentials answer **401**, not 422: the payload is valid, what
        failed was the authentication. The message is the same for an unknown
        email and a wrong password, so as not to reveal which emails exist.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
            example:
              email: admin@billing.test
              password: password
      responses:
        200:
          description: Token emitido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
              example:
                token: 25|0NzEwjqYpQAmZcW1dg8kLjLaJ5dEtjBLGdq4AqpL9ff06cb3
                user:
                  id: 1
                  name: Administrador
                  email: admin@billing.test
        401:
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                message: Credenciais inválidas.
        422:
          $ref: '#/components/responses/ErroDeValidacao'
        429:
          description: |
            Too many attempts. There are two counts, per minute: **5** for the
            same account from the same IP, which is brute force against one
            account, and **20** for the same IP across every account, which is an
            email sweep. The `Retry-After` header carries the seconds left.

            A request with neither email nor password does not count: it is not an
            authentication attempt. And a successful login clears the account's
            count — not the IP's.
          headers:
            Retry-After:
              description: Seconds until the next attempt is accepted.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                message: Muitas tentativas de login. Tente de novo em 42 segundos.

  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Revokes the current session's token
      description: |
        Revokes only the token used in this call. The same user's other tokens
        stay valid — signing out in the browser does not knock out the phone.
      operationId: logout
      responses:
        200:
          description: Session ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                message: Sessão encerrada.
        401:
          $ref: '#/components/responses/NaoAutenticado'

  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Returns the token's user
      description: |
        Used by the frontend's authenticated layout to confirm the cookie still
        corresponds to a valid token. Next's middleware only looks at the cookie's
        presence; this route is what confirms it is valid.
      operationId: me
      responses:
        200:
          description: Authenticated user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
              example:
                user:
                  id: 1
                  name: Administrador
                  email: admin@billing.test
        401:
          $ref: '#/components/responses/NaoAutenticado'

  # ------------------------------------------------------------- dashboard ---

  /api/dashboard:
    get:
      tags: [Dashboard]
      summary: The month's indicators and a twelve-month series
      description: |
        The home screen in one call. Two aggregations in the database, not a
        single row loaded to be summed in memory.

        `period` scopes the **current month by due date** — what falls due now,
        what has come in and what is still to come. `monthly` brings the last
        twelve months, the current one included, for the billed-against-received
        chart.

        Two readings that hold for both blocks:

        - **`received_amount` comes from the frozen columns**, never from a
          recompute. It is the report's rule, and the dashboard cannot disagree
          with it.
        - **`pending_amount` already includes today's interest**: it is the
          updated amount of what is unpaid, not the sum of the original amounts.

        Measured against 2,000,000 billings: 0.66s to 0.93s.
      operationId: dashboard
      responses:
        200:
          description: Indicators and series.
          content:
            application/json:
              schema:
                type: object
                properties:
                  period:
                    $ref: '#/components/schemas/DashboardPeriod'
                  monthly:
                    type: array
                    items:
                      $ref: '#/components/schemas/DashboardMonth'
              example:
                period:
                  label: Setembro de 2026
                  start_date: "2026-09-01"
                  end_date: "2026-09-30"
                  count: 54926
                  original_amount: "278768833.46"
                  received_amount: "111606598.70"
                  pending_amount: "167554107.67"
                  interest_amount: "343072.66"
                  overdue_count: 11890
                monthly:
                  - month: "2026-08"
                    label: ago/26
                    count: 56389
                    original_amount: "284730191.31"
                    received_amount: "115024428.54"
                  - month: "2026-09"
                    label: set/26
                    count: 54926
                    original_amount: "278768833.46"
                    received_amount: "111606598.70"
        401:
          $ref: '#/components/responses/NaoAutenticado'

  # ------------------------------------------------------------- clientes ---

  /api/customers:
    get:
      tags: [Customers]
      summary: Lists customers
      description: |
        Searching, filtering, sorting and pagination all happen **in the
        database**. The search term matches name and email with `LIKE`, and
        matches the document only if the term has digits — without that guard, a
        textual term would become `document LIKE '%'` and bring back the whole
        table.
      operationId: listarClientes
      parameters:
        - name: search
          in: query
          description: Nome, e-mail ou documento.
          schema:
            type: string
            maxLength: 255
          example: silva
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/StatusDoCliente'
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, document, email, status, created_at]
            default: name
        - name: direction
          in: query
          schema:
            $ref: '#/components/schemas/Direcao'
        - name: per_page
          in: query
          description: Capped at 100. Without a cap, `per_page=999999` would take the API down.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        200:
          description: A page of customers.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Customer'
                  - $ref: '#/components/schemas/Paginacao'
              example:
                data:
                  - id: 1
                    name: Comércio Silva LTDA
                    document: "12345678000190"
                    email: financeiro@silva.test
                    status: active
                    status_label: Ativo
                    created_at: "2026-09-12T04:42:44+00:00"
                links:
                  first: http://localhost:8000/api/customers?page=1
                  last: http://localhost:8000/api/customers?page=1
                  prev: null
                  next: null
                meta:
                  current_page: 1
                  from: 1
                  last_page: 1
                  path: http://localhost:8000/api/customers
                  per_page: 15
                  to: 1
                  total: 1
        401:
          $ref: '#/components/responses/NaoAutenticado'
        422:
          $ref: '#/components/responses/ErroDeValidacao'

    post:
      tags: [Customers]
      summary: Creates a customer
      description: |
        The document is stored as **digits only**: keeping the formatting would
        make the search depend on how it was typed. A CPF has 11 digits and a CNPJ
        has 14; nothing in between is accepted, and the document is unique across
        the base.
      operationId: criarCliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
            example:
              name: Comércio Silva LTDA
              document: "12345678000190"
              email: financeiro@silva.test
              status: active
      responses:
        201:
          description: Cliente criado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Customer'
              example:
                data:
                  id: 1
                  name: Comércio Silva LTDA
                  document: "12345678000190"
                  email: financeiro@silva.test
                  status: active
                  status_label: Ativo
                  created_at: "2026-09-12T04:42:44+00:00"
        401:
          $ref: '#/components/responses/NaoAutenticado'
        403:
          $ref: '#/components/responses/PerfilSemPermissao'
        422:
          description: |
            Validation failed. The errors come field by field, which is what lets
            the form mark the wrong field instead of showing a loose warning.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
              example:
                message: O campo nome é obrigatório. (and 3 more errors)
                errors:
                  name:
                    - O campo nome é obrigatório.
                  document:
                    - O documento deve ser um CPF (11 dígitos) ou CNPJ (14 dígitos).
                  email:
                    - O campo e-mail deve ser um e-mail válido.
                  status:
                    - O valor selecionado em status é inválido.

  /api/customers/import:
    post:
      tags: [Customers]
      summary: Imports customers from a CSV file
      description: |
        Two steps on the same endpoint. With `?preview=1` the file is analysed
        and **nothing is written** — the response says what would happen. Without
        the parameter, the valid rows are imported.

        **A partial import is the expected behaviour**, not a failure: a row with
        an error does not stop the others from going in. The valid ones go in and
        the refused ones come back in `errors`, with the line number **from the
        file** (counting the header, which is how the user will find it in the
        spreadsheet) and the reason.

        The file is read row by row, so its size does not have to fit in the
        process's memory. Writing goes in batches of 500, with the batch's
        documents checked against the database in a single query.

        On the format: the separator is detected — `;` from Excel in Portuguese or
        `,` — and the header accepts aliases (`nome` or `name`, `documento` or
        `cpf`). The document may arrive formatted; the formatting is stripped. An
        empty status assumes active.

        A file missing the required columns is refused **whole**, with a 422:
        there is nothing to import partially when you cannot even tell what each
        column is.
      operationId: importarClientes
      parameters:
        - name: preview
          in: query
          description: Analisa sem gravar.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: A CSV of up to 20 MB.
      responses:
        200:
          description: |
            A report of what happened — or of what would happen, on a preview.
            `imported_count` is always 0 when `preview=1`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatorioDeImportacao'
              example:
                total_rows: 5
                valid_count: 3
                imported_count: 3
                error_count: 2
                errors_truncated: false
                errors:
                  - line: 4
                    messages:
                      - O documento deve ser um CPF (11 dígitos) ou CNPJ (14 dígitos).
                    values:
                      name: Documento Curto ME
                      document: "123"
                      email: curto@exemplo.test
                      status: ativo
                  - line: 6
                    messages:
                      - O campo e-mail é obrigatório.
                    values:
                      name: Sem Email LTDA
                      document: "44555666000177"
                      email: ""
                      status: ativo
                sample:
                  - name: Comércio Silva LTDA
                    document: "12345678000190"
                    email: financeiro@silva.test
                    status: active
        401:
          $ref: '#/components/responses/NaoAutenticado'
        403:
          $ref: '#/components/responses/PerfilSemPermissao'
        422:
          description: |
            The file is no good: it is not a CSV, it exceeds the size, or the
            header is missing the required columns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
              example:
                message: "O arquivo precisa das colunas: documento, email. Cabeçalho recebido: nome, telefone."
                errors:
                  file:
                    - "O arquivo precisa das colunas: documento, email. Cabeçalho recebido: nome, telefone."

  /api/customers/{customer}:
    parameters:
      - $ref: '#/components/parameters/IdDoCliente'
    get:
      tags: [Customers]
      summary: Shows a customer
      operationId: exibirCliente
      responses:
        200:
          description: Cliente encontrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Customer'
              example:
                data:
                  id: 1
                  name: Comércio Silva LTDA
                  document: "12345678000190"
                  email: financeiro@silva.test
                  status: active
                  status_label: Ativo
                  created_at: "2026-09-12T04:42:44+00:00"
        401:
          $ref: '#/components/responses/NaoAutenticado'
        404:
          $ref: '#/components/responses/NaoEncontrado'

    put:
      tags: [Customers]
      summary: Updates a customer
      description: |
        The document's uniqueness ignores the record itself — without that nobody
        could save an edit without first changing the document.
      operationId: atualizarCliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
            example:
              name: Comércio Silva LTDA
              document: "12345678000190"
              email: contato@silva.test
              status: inactive
      responses:
        200:
          description: Cliente atualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Customer'
              example:
                data:
                  id: 1
                  name: Comércio Silva LTDA
                  document: "12345678000190"
                  email: contato@silva.test
                  status: inactive
                  status_label: Inativo
                  created_at: "2026-09-12T04:42:44+00:00"
        401:
          $ref: '#/components/responses/NaoAutenticado'
        403:
          $ref: '#/components/responses/PerfilSemPermissao'
        404:
          $ref: '#/components/responses/NaoEncontrado'
        422:
          $ref: '#/components/responses/ErroDeValidacao'

    patch:
      tags: [Customers]
      summary: Updates a customer (same contract as PUT)
      description: |
        The route accepts both verbs and applies the same rules: every field is
        still required. It is documented because it is registered — `PATCH` here
        is not a partial update.
      operationId: atualizarClienteParcial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
            example:
              name: Comércio Silva LTDA
              document: "12345678000190"
              email: contato@silva.test
              status: inactive
      responses:
        200:
          description: Cliente atualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Customer'
              example:
                data:
                  id: 1
                  name: Comércio Silva LTDA
                  document: "12345678000190"
                  email: contato@silva.test
                  status: inactive
                  status_label: Inativo
                  created_at: "2026-09-12T04:42:44+00:00"
        401:
          $ref: '#/components/responses/NaoAutenticado'
        403:
          $ref: '#/components/responses/PerfilSemPermissao'
        404:
          $ref: '#/components/responses/NaoEncontrado'
        422:
          $ref: '#/components/responses/ErroDeValidacao'

  # ------------------------------------------------------------ cobranças ---

  /api/billings:
    get:
      tags: [Billings]
      summary: Lists billings
      description: |
        `interest_amount` and `updated_amount` come out of the `SELECT` itself,
        through the SQL face of the interest calculation. That is what makes it
        possible to sort by updated amount without loading the set into memory.

        The customer comes along through eager loading: without it, serialising a
        page of 15 rows would fire 15 queries.
      operationId: listarCobrancas
      parameters:
        - name: customer_id
          in: query
          schema:
            type: integer
          example: 1
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/StatusDaCobranca'
        - name: search
          in: query
          description: A fragment of the description.
          schema:
            type: string
            maxLength: 255
        - name: sort
          in: query
          schema:
            type: string
            enum: [id, due_date, issue_date, original_amount, created_at]
            default: id
        - name: direction
          in: query
          schema:
            $ref: '#/components/schemas/Direcao'
            default: desc
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        200:
          description: A page of billings.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Billing'
                  - $ref: '#/components/schemas/Paginacao'
              example:
                data:
                  - id: 1
                    description: Mensalidade de agosto
                    original_amount: "1500.00"
                    monthly_interest_rate: "0.0200"
                    issue_date: "2026-07-10"
                    due_date: "2026-08-09"
                    payment_date: null
                    status: pending
                    status_label: Pendente
                    is_overdue: true
                    paid_amount: null
                    paid_interest_amount: null
                    interest_amount: "34.05"
                    updated_amount: "1534.05"
                    customer:
                      id: 1
                      name: Comércio Silva LTDA
                      document: "12345678000190"
                      email: financeiro@silva.test
                      status: active
                      status_label: Ativo
                      created_at: "2026-09-12T04:42:44+00:00"
                links:
                  first: http://localhost:8000/api/billings?page=1
                  last: http://localhost:8000/api/billings?page=1
                  prev: null
                  next: null
                meta:
                  current_page: 1
                  from: 1
                  last_page: 1
                  path: http://localhost:8000/api/billings
                  per_page: 15
                  to: 1
                  total: 1
        401:
          $ref: '#/components/responses/NaoAutenticado'
        422:
          $ref: '#/components/responses/ErroDeValidacao'

    post:
      tags: [Billings]
      summary: Creates a billing
      description: |
        `status` and the payment fields are **not accepted** here, even if sent.
        Every billing is born pending: accepting `status: paid` would create a paid
        billing without the frozen amounts, and what makes that transition is
        `POST /api/billings/{billing}/payment`.

        The rate is a monthly fraction, not a percentage: `0.02` is 2% a month.
      operationId: criarCobranca
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingInput'
            example:
              customer_id: 1
              description: Mensalidade de agosto
              original_amount: 1500.00
              monthly_interest_rate: 0.02
              issue_date: "2026-07-10"
              due_date: "2026-08-09"
      responses:
        201:
          description: Billing created, always pending.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Billing'
              example:
                data:
                  id: 1
                  description: Mensalidade de agosto
                  original_amount: "1500.00"
                  monthly_interest_rate: "0.0200"
                  issue_date: "2026-07-10"
                  due_date: "2026-08-09"
                  payment_date: null
                  status: pending
                  status_label: Pendente
                  is_overdue: true
                  paid_amount: null
                  paid_interest_amount: null
                  interest_amount: "34.05"
                  updated_amount: "1534.05"
        401:
          $ref: '#/components/responses/NaoAutenticado'
        403:
          $ref: '#/components/responses/PerfilSemPermissao'
        422:
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
              example:
                message: O campo data de vencimento deve ser uma data posterior ou igual a data de emissão.
                errors:
                  due_date:
                    - O campo data de vencimento deve ser uma data posterior ou igual a data de emissão.

  /api/billings/import:
    post:
      tags: [Billings]
      summary: Imports billings from a CSV file
      description: |
        The same mechanics as the customer import — `?preview=1` analyses without
        writing, a partial import is the expected behaviour, and refused rows come
        back with the file's line number and the reason — with two rules of its
        own.

        **The customer is resolved by document**, which has to exist already. The
        file comes from outside and does not know the internal id; the document is
        the business identity both ends have. A row whose document does not exist
        fails on its own, without stopping the others.

        **The billing is born pending**, like one created through the screen. A
        status or paid-amount column in the file is **ignored**, not accepted:
        accepting `paid` would create a paid billing without the frozen amounts,
        and what makes that transition is
        `POST /api/billings/{billing}/payment`.

        Accepted formats, because the file usually comes out of a spreadsheet: an
        amount as `1.234,56` or `1234.56`, a date as `09/08/2026` or
        `2026-08-09`, a rate as `0,02`. A missing rate becomes zero — a billing
        with no interest is legitimate.

        Unlike customers, **identical rows create two billings**: a billing has no
        natural key, and two monthly charges for the same customer with the same
        due date are two real billings.
      operationId: importarCobrancas
      parameters:
        - name: preview
          in: query
          description: Analisa sem gravar.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    A CSV with the columns documento, descricao, valor, emissao
                    and vencimento. The rate is optional.
      responses:
        200:
          description: A report of what happened — or of what would happen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatorioDeImportacao'
              example:
                total_rows: 5
                valid_count: 3
                imported_count: 3
                error_count: 2
                errors_truncated: false
                errors:
                  - line: 4
                    messages:
                      - O vencimento não pode ser anterior à emissão.
                    values:
                      document: "12345678000190"
                      description: Vencimento invertido
                  - line: 5
                    messages:
                      - Nenhum cliente cadastrado com este documento.
                    values:
                      document: "00000000000000"
                      description: Cliente que não existe
                sample:
                  - document: "12345678000190"
                    description: Mensalidade de setembro
                    original_amount: "1500.00"
                    monthly_interest_rate: "0.02"
                    issue_date: "2026-08-10"
                    due_date: "2026-09-09"
        401:
          $ref: '#/components/responses/NaoAutenticado'
        403:
          $ref: '#/components/responses/PerfilSemPermissao'
        422:
          description: |
            O arquivo não serve: não é CSV, passa do tamanho, ou o cabeçalho não
            tem as colunas obrigatórias.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
              example:
                message: "O arquivo precisa das colunas: valor, emissao, vencimento. Cabeçalho recebido: documento, descricao."
                errors:
                  file:
                    - "O arquivo precisa das colunas: valor, emissao, vencimento. Cabeçalho recebido: documento, descricao."

  /api/billings/{billing}:
    parameters:
      - $ref: '#/components/parameters/IdDaCobranca'
    get:
      tags: [Billings]
      summary: Shows a billing
      description: |
        On a single billing the interest is computed in PHP, and not by the
        `SELECT` as in the listing. There is a test asserting both paths return the
        same value down to the cent — it is what upholds the requirement of a
        consistent result across screens and report.
      operationId: exibirCobranca
      responses:
        200:
          description: Billing found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Billing'
              example:
                data:
                  id: 1
                  description: Mensalidade de agosto
                  original_amount: "1500.00"
                  monthly_interest_rate: "0.0200"
                  issue_date: "2026-07-10"
                  due_date: "2026-08-09"
                  payment_date: "2026-09-08"
                  status: paid
                  status_label: Paga
                  is_overdue: false
                  paid_amount: "1530.00"
                  paid_interest_amount: "30.00"
                  interest_amount: "30.00"
                  updated_amount: "1530.00"
        401:
          $ref: '#/components/responses/NaoAutenticado'
        404:
          $ref: '#/components/responses/NaoEncontrado'

    put:
      tags: [Billings]
      summary: Updates a pending billing
      description: |
        **A paid billing is immutable.** Changing the amount or the rate after
        payment would invalidate `paid_amount` and `paid_interest_amount`, which
        were frozen at the payment date and are not recomputable — the calculation
        is a function of that date. The attempt answers 422.
      operationId: atualizarCobranca
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingInput'
            example:
              customer_id: 1
              description: Mensalidade de agosto (revisada)
              original_amount: 1600.00
              monthly_interest_rate: 0.02
              issue_date: "2026-07-10"
              due_date: "2026-08-09"
      responses:
        200:
          description: Billing updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Billing'
              example:
                data:
                  id: 1
                  description: Mensalidade de agosto (revisada)
                  original_amount: "1600.00"
                  monthly_interest_rate: "0.0200"
                  issue_date: "2026-07-10"
                  due_date: "2026-08-09"
                  payment_date: null
                  status: pending
                  status_label: Pendente
                  is_overdue: true
                  paid_amount: null
                  paid_interest_amount: null
                  interest_amount: "36.32"
                  updated_amount: "1636.32"
        401:
          $ref: '#/components/responses/NaoAutenticado'
        403:
          $ref: '#/components/responses/PerfilSemPermissao'
        404:
          $ref: '#/components/responses/NaoEncontrado'
        422:
          description: Validation failed, or the billing is already paid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
              example:
                message: Uma cobrança paga não pode ser editada.
                errors:
                  status:
                    - Uma cobrança paga não pode ser editada.

    patch:
      tags: [Billings]
      summary: Updates a pending billing (same contract as PUT)
      description: |
        The route accepts both verbs and applies the same rules, including the one
        that a paid billing is immutable.
      operationId: atualizarCobrancaParcial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingInput'
            example:
              customer_id: 1
              description: Mensalidade de agosto (revisada)
              original_amount: 1600.00
              monthly_interest_rate: 0.02
              issue_date: "2026-07-10"
              due_date: "2026-08-09"
      responses:
        200:
          description: Billing updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Billing'
              example:
                data:
                  id: 1
                  description: Mensalidade de agosto (revisada)
                  original_amount: "1600.00"
                  monthly_interest_rate: "0.0200"
                  issue_date: "2026-07-10"
                  due_date: "2026-08-09"
                  payment_date: null
                  status: pending
                  status_label: Pendente
                  is_overdue: true
                  paid_amount: null
                  paid_interest_amount: null
                  interest_amount: "36.32"
                  updated_amount: "1636.32"
        401:
          $ref: '#/components/responses/NaoAutenticado'
        403:
          $ref: '#/components/responses/PerfilSemPermissao'
        404:
          $ref: '#/components/responses/NaoEncontrado'
        422:
          $ref: '#/components/responses/ErroDeValidacao'

  /api/billings/{billing}/payment:
    parameters:
      - $ref: '#/components/parameters/IdDaCobranca'
    post:
      tags: [Billings]
      summary: Records the payment and freezes the interest
      description: |
        The interest is computed **at the payment date**, not at today: paying
        with a backdated date produces that day's value. From here on the billing
        stops accruing, and the displayed amount comes from the stored columns.

        Both fields are optional:

        - A missing `payment_date` assumes today. It cannot be in the future —
          interest is a function of the date, and accepting a future date would
          store a freeze that has not happened yet — nor before the issue date.
        - A missing `paid_amount` assumes the updated amount. Supplying it covers
          settlements and discounts; the computed interest stays recorded in
          `paid_interest_amount` either way.

        ## Idempotency

        This and the reversal are the API's idempotent operations — the two where
        repeating moves money around. By sending `Idempotency-Key`, the second call
        **returns the first one's result** instead of processing again — with
        `Idempotent-Replay: true` in the response header, so the caller can tell
        "just paid" from "had already paid".

        The stored response is whatever the first call produced, whatever that was:
        a validation 422 replays as a 422. A 500 is **not** stored, because after a
        server error the right move is to try again.

        Three situations the key does not cover, and should not:

        - **Without the header, nothing changes.** Paying an already paid billing
          still answers 422. Idempotency serves whoever repeats the same operation;
          turning every second attempt into a success would hide a real error.
        - **The same key with different content answers 422.** That includes using
          the same key on another billing. It is the caller's bug, and returning the
          old result would hide the bug.
        - **The key is valid for 24 hours.** After that it is a new key.
        - **A reversal does not invalidate the key.** It describes the act of
          paying, which happened: a late retry arriving after the reversal receives
          the original result instead of paying again.
      operationId: registrarPagamento
      parameters:
        - $ref: '#/components/parameters/ChaveDeIdempotencia'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_date:
                  type: [string, "null"]
                  format: date
                  description: The payment date. Missing assumes today.
                paid_amount:
                  type: [string, "null"]
                  description: Valor recebido. Ausente assume o valor atualizado.
            example:
              payment_date: "2026-09-08"
      responses:
        200:
          description: |
            Payment recorded. In the example, R$ 1,500.00 at 2% a month with 30
            days late: `1500 * 1.02^1 = 1530.00`, of which R$ 30.00 is interest —
            and those numbers never change again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Billing'
              example:
                data:
                  id: 1
                  description: Mensalidade de agosto
                  original_amount: "1500.00"
                  monthly_interest_rate: "0.0200"
                  issue_date: "2026-07-10"
                  due_date: "2026-08-09"
                  payment_date: "2026-09-08"
                  status: paid
                  status_label: Paga
                  is_overdue: false
                  paid_amount: "1530.00"
                  paid_interest_amount: "30.00"
                  interest_amount: "30.00"
                  updated_amount: "1530.00"
        401:
          $ref: '#/components/responses/NaoAutenticado'
        403:
          $ref: '#/components/responses/PerfilSemPermissao'
        404:
          $ref: '#/components/responses/NaoEncontrado'
        409:
          $ref: '#/components/responses/RequisicaoEmAndamento'
        422:
          description: |
            An invalid date, an invalid amount, the billing is already paid — or
            the idempotency key has already been used for another request, which
            comes back without the `errors` block since it is not a field error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
              example:
                message: Esta cobrança já está paga.
                errors:
                  status:
                    - Esta cobrança já está paga.

  /api/billings/{billing}/reversal:
    parameters:
      - $ref: '#/components/parameters/IdDaCobranca'
    post:
      tags: [Billings]
      summary: Reverses the payment
      description: |
        Undoes a payment that did not hold up — a bounced cheque, a reversed
        transfer, a settlement posted against the wrong billing. It has no body.

        - **The billing goes back to pending**, with `payment_date`, `paid_amount`
          and `paid_interest_amount` null.
        - **The frozen amounts do not disappear**: they go into the audit trail, in
          the reversal entry's `from`.
        - **The interest starts running again from the original due date**, not
          from the payment nor from the reversal. A payment that did not hold up
          did not happen as far as the debtor is concerned, and a reversal must not
          turn into a discount.

        A reversed billing can be paid again, and then the interest freezes at the
        new date.

        It accepts `Idempotency-Key`, for the same reason as the payment: paid,
        reversed, paid again — a late reversal retry, with no key, would undo the
        second payment.
      operationId: estornarPagamento
      parameters:
        - $ref: '#/components/parameters/ChaveDeIdempotencia'
      responses:
        200:
          description: |
            Payment reversed. In the example, R$ 1,500.00 at 2% a month due on
            09/08 and reversed on 14/09: 36 days late from the due date,
            `1500 * 1.02^(36/30) = 1536.07`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Billing'
              example:
                data:
                  id: 1
                  description: Mensalidade de agosto
                  original_amount: "1500.00"
                  monthly_interest_rate: "0.0200"
                  issue_date: "2026-07-10"
                  due_date: "2026-08-09"
                  payment_date: null
                  status: pending
                  status_label: Pendente
                  is_overdue: true
                  paid_amount: null
                  paid_interest_amount: null
                  interest_amount: "36.07"
                  updated_amount: "1536.07"
        401:
          $ref: '#/components/responses/NaoAutenticado'
        403:
          $ref: '#/components/responses/PerfilSemPermissao'
        404:
          $ref: '#/components/responses/NaoEncontrado'
        409:
          $ref: '#/components/responses/RequisicaoEmAndamento'
        422:
          description: The billing is not paid — or the idempotency key has already been used for another request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
              example:
                message: Só uma cobrança paga pode ser estornada.
                errors:
                  status:
                    - Só uma cobrança paga pode ser estornada.

  /api/billings/{billing}/audit:
    parameters:
      - $ref: '#/components/parameters/IdDaCobranca'
    get:
      tags: [Billings]
      summary: The billing's audit trail
      description: |
        Who changed what, and when — newest change first, fifty per page.

        **Edits**, **payments** and **reversals** get in. Creation and importing do
        not: the trail starts at the first change, and the billing's `created_at`
        already says when it was born.

        `from` and `to` arrive as the database stores them — money as a decimal
        string, a date as `YYYY-MM-DD`, status by its enum value, a customer by id.
        Only a field that actually changed gets in: `"1000"` over `"1000.00"` is the
        same number and does not appear.

        The payment entry keeps the frozen amounts in `to`, and the reversal's
        brings them in `from`: the billing's payment columns are cleared, and what
        was paid stays recorded here.

        `user` is null when the change did not come from a request — the console or
        an artisan command.
      operationId: trilhaDaCobranca
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        200:
          description: The trail's entries, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EntradaDeAuditoria'
                  links:
                    type: object
                  meta:
                    type: object
              example:
                data:
                  - id: 2
                    event: paid
                    event_label: Pagamento registrado
                    user:
                      id: 1
                      name: Administrador
                    changes:
                      - field: status
                        label: Status
                        from: pending
                        to: paid
                      - field: payment_date
                        label: Data do pagamento
                        from: null
                        to: "2026-09-14"
                      - field: paid_amount
                        label: Valor pago
                        from: null
                        to: "1530.00"
                      - field: paid_interest_amount
                        label: Juros no pagamento
                        from: null
                        to: "30.00"
                    created_at: "2026-09-14T13:02:11+00:00"
                  - id: 1
                    event: updated
                    event_label: Editada
                    user:
                      id: 1
                      name: Administrador
                    changes:
                      - field: due_date
                        label: Vencimento
                        from: "2026-08-09"
                        to: "2026-08-15"
                    created_at: "2026-09-14T12:58:40+00:00"
        401:
          $ref: '#/components/responses/NaoAutenticado'
        404:
          $ref: '#/components/responses/NaoEncontrado'

  # ------------------------------------------------------------ relatório ---

  /api/reports/billings:
    get:
      tags: [Report]
      summary: The billing report by period
      description: |
        Beyond the page of billings, the response carries three blocks:

        - **`totals`** — an aggregation over the **whole** filtered set, from a
          query of its own. It is not the page's sum: whoever is on page 3 of a
          thousand-billing report needs the report's total. It is cached per scope
          and is never served stale: any write to a billing and the day rolling
          over both recompute it. Sorting and paging are not part of the scope —
          reordering reuses the totals.
        - **`filters`** — an echo of the applied scope, already normalised. The
          screen re-displays them and the exports print them in the file's header
          from this same source.
        - **`export`** — the PDF's cap and whether the current scope fits it, so
          the screen can disable the button **before** the click instead of
          sending the user into a 422.

        The period can be scoped by issue, due or payment date, at the caller's
        choice — each one has an index of its own.
      operationId: relatorioDeFaturamento
      parameters:
        - $ref: '#/components/parameters/BaseDaData'
        - $ref: '#/components/parameters/InicioDoPeriodo'
        - $ref: '#/components/parameters/FimDoPeriodo'
        - $ref: '#/components/parameters/ClienteDoRelatorio'
        - $ref: '#/components/parameters/StatusDoRelatorio'
        - name: sort
          in: query
          schema:
            type: string
            enum: [issue_date, due_date, payment_date, original_amount, interest_amount, updated_amount]
            default: due_date
          description: |
            Sorting by `updated_amount` or `interest_amount` is only possible
            because the calculation exists in SQL.
        - name: direction
          in: query
          schema:
            $ref: '#/components/schemas/Direcao'
            default: desc
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        200:
          description: A page of the report, with totals for the whole set.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Billing'
                      totals:
                        $ref: '#/components/schemas/Totais'
                      filters:
                        $ref: '#/components/schemas/Filtros'
                      export:
                        type: object
                        properties:
                          pdf_max_rows:
                            type: integer
                          pdf_available:
                            type: boolean
                  - $ref: '#/components/schemas/Paginacao'
              example:
                data:
                  - id: 1
                    description: Mensalidade de agosto
                    original_amount: "1500.00"
                    monthly_interest_rate: "0.0200"
                    issue_date: "2026-07-10"
                    due_date: "2026-08-09"
                    payment_date: null
                    status: pending
                    status_label: Pendente
                    is_overdue: true
                    paid_amount: null
                    paid_interest_amount: null
                    interest_amount: "34.05"
                    updated_amount: "1534.05"
                    customer:
                      id: 1
                      name: Comércio Silva LTDA
                      document: "12345678000190"
                      email: financeiro@silva.test
                      status: active
                      status_label: Ativo
                      created_at: "2026-09-12T04:42:44+00:00"
                links:
                  first: http://localhost:8000/api/reports/billings?page=1
                  last: http://localhost:8000/api/reports/billings?page=1
                  prev: null
                  next: null
                meta:
                  current_page: 1
                  from: 1
                  last_page: 1
                  path: http://localhost:8000/api/reports/billings
                  per_page: 25
                  to: 1
                  total: 1
                totals:
                  count: 1
                  original_amount: "1500.00"
                  interest_amount: "34.05"
                  updated_amount: "1534.05"
                  paid_amount: "0.00"
                  pending_amount: "1534.05"
                filters:
                  date_field: due_date
                  start_date: null
                  end_date: null
                  customer_id: null
                  status: null
                  sort: due_date
                  direction: desc
                export:
                  pdf_max_rows: 1000
                  pdf_available: true
        401:
          $ref: '#/components/responses/NaoAutenticado'
        422:
          description: Invalid filter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
              example:
                message: A data final não pode ser anterior à inicial.
                errors:
                  end_date:
                    - A data final não pode ser anterior à inicial.

  /api/reports/billings/csv:
    get:
      tags: [Report]
      summary: Exports the report to CSV
      description: |
        **No row limit.** The file is written row by row while the result is
        walked, and at no point does the set exist whole in memory — that is what
        makes it possible to export hundreds of thousands of billings.

        It accepts exactly the same filters as the screen, validated by the same
        object: the file is the report that is on the screen, not a second, similar
        query. The period, the filters and the totals are printed in the file
        itself.

        Separator `;` and a UTF-8 BOM, because the destination is Excel — without
        the BOM it opens the file as Latin-1 and the accents turn to garbage.
      operationId: exportarRelatorioCsv
      parameters:
        - $ref: '#/components/parameters/BaseDaData'
        - $ref: '#/components/parameters/InicioDoPeriodo'
        - $ref: '#/components/parameters/FimDoPeriodo'
        - $ref: '#/components/parameters/ClienteDoRelatorio'
        - $ref: '#/components/parameters/StatusDoRelatorio'
      responses:
        200:
          description: A CSV file, streamed.
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="relatorio-faturamento-2026-09-12-044244.csv"
          content:
            text/csv:
              schema:
                type: string
              example: |
                Relatório de faturamento
                Base do período;Data de vencimento
                Status;Todos
                Cliente;Descrição;Emissão;Vencimento;Pagamento;Valor original;Juros;Valor atualizado;Status
                Comércio Silva LTDA;Mensalidade de agosto;10/07/2026;09/08/2026;;1500,00;34,05;1534,05;Vencida
                TOTAIS;;;;;1500,00;34,05;1534,05;
        401:
          $ref: '#/components/responses/NaoAutenticado'
        422:
          $ref: '#/components/responses/ErroDeValidacao'

  /api/reports/billings/pdf:
    get:
      tags: [Report]
      summary: Exports the report to PDF
      description: |
        **There is a row cap, and that is a design decision.** A PDF has to be
        paginated and assembled whole before it can be delivered, so there is no
        streaming version like the CSV's. Above the cap the API answers 422
        pointing at the CSV, rather than blowing the process's memory.

        The cap came from measuring against the real base, with nine columns:

        | Rows | Memory | Time |
        |---|---|---|
        | 500 | 184 MB | 9.6s |
        | 1,000 | 420 MB | 17.9s |
        | 2,000 | 1,164 MB | 56.5s |
        | 3,500 | 2,965 MB | 210.0s |
        | 5,000 | blew past 3 GB | — |

        The growth is superlinear: doubling the rows almost triples the memory.
        Hence the cap at 1,000.

        The count that decides this comes from the totals query, before any row is
        loaded — finding out there are too many rows costs loading none of them.
      operationId: exportarRelatorioPdf
      parameters:
        - $ref: '#/components/parameters/BaseDaData'
        - $ref: '#/components/parameters/InicioDoPeriodo'
        - $ref: '#/components/parameters/FimDoPeriodo'
        - $ref: '#/components/parameters/ClienteDoRelatorio'
        - $ref: '#/components/parameters/StatusDoRelatorio'
      responses:
        200:
          description: Documento PDF.
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="relatorio-faturamento-2026-09-12-044244.pdf"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        401:
          $ref: '#/components/responses/NaoAutenticado'
        422:
          description: |
            The scope exceeds the PDF's row cap. The response carries the count
            and the limit so the screen can explain what happened, and the message
            points at the route that works.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  count:
                    type: integer
                  limit:
                    type: integer
              example:
                message: O relatório tem 56.680 cobranças e o limite do PDF é 1.000. Use a exportação em CSV, que não tem limite.
                count: 56680
                limit: 1000

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A Sanctum token obtained from `POST /api/auth/login`.

  parameters:
    IdDoCliente:
      name: customer
      in: path
      required: true
      description: The customer's ID.
      schema:
        type: integer
      example: 1

    IdDaCobranca:
      name: billing
      in: path
      required: true
      description: The billing's ID.
      schema:
        type: integer
      example: 1

    BaseDaData:
      name: date_field
      in: query
      description: |
        Which of the three dates defines the period. Each one has an index of its
        own, and the choice changes the scope: the same billing falls into one
        period by issue date and another by due date.
      schema:
        type: string
        enum: [issue_date, due_date, payment_date]
        default: due_date

    InicioDoPeriodo:
      name: start_date
      in: query
      schema:
        type: string
        format: date
      example: "2026-01-01"

    FimDoPeriodo:
      name: end_date
      in: query
      description: It cannot be earlier than `start_date`.
      schema:
        type: string
        format: date
      example: "2026-12-31"

    ClienteDoRelatorio:
      name: customer_id
      in: query
      schema:
        type: integer
      example: 1

    StatusDoRelatorio:
      name: status
      in: query
      description: |
        `overdue` is not a stored status: it is the derived condition of pending
        with the due date in the past. `pending` brings the overdue ones along,
        because overdue is a case of pending.
      schema:
        type: string
        enum: [pending, paid, overdue]

    ChaveDeIdempotencia:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Identifies the operation so that repeating it does not execute it twice.

        Optional, and the name comes from the IETF draft
        (`draft-ietf-httpapi-idempotency-key-header`). Any unique string of up to
        255 characters will do — a v4 UUID is the natural choice. The scope is per
        user: two clients can draw the same key without seeing each other.
      schema:
        type: string
        maxLength: 255
      example: 6f1b2c4a-9e77-4d2f-9a0a-1c3b5d7e9f11

  responses:
    NaoAutenticado:
      description: Token missing, invalid or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Mensagem'
          example:
            message: Unauthenticated.

    PerfilSemPermissao:
      description: |
        The user's role is read-only and does not write. This is the real barrier:
        hiding the button on screen is a convenience for whoever cannot use it, and
        whoever knows the endpoint's address reaches it without passing through any
        screen.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Mensagem'
          example:
            message: Seu perfil é de consulta e não permite esta operação.

    NaoEncontrado:
      description: The record does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Mensagem'
          example:
            message: Registro não encontrado.

    RequisicaoEmAndamento:
      description: |
        Another request with this same idempotency key is still being processed.
        It is the answer to the fast double click, where the second request arrives
        before the first has finished — and it is what stops both from processing.

        It is not a failure: try again in a moment and the response stored by the
        first will come.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Mensagem'
          example:
            message: Uma requisição com esta chave de idempotência ainda está em andamento.

    ErroDeValidacao:
      description: |
        Validation failed. The errors come field by field, which is what lets the
        form mark the wrong field instead of showing a loose warning.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroDeValidacao'
          example:
            message: O campo nome é obrigatório.
            errors:
              name:
                - O campo nome é obrigatório.

  schemas:
    EntradaDeAuditoria:
      type: object
      properties:
        id:
          type: integer
        event:
          type: string
          enum: [updated, paid, reversed]
        event_label:
          type: string
        user:
          type: [object, "null"]
          properties:
            id:
              type: integer
            name:
              type: string
        changes:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              label:
                type: string
              from:
                type: [string, integer, "null"]
              to:
                type: [string, integer, "null"]
        created_at:
          type: string
          format: date-time

    Dinheiro:
      type: string
      description: |
        A two-digit decimal, as a string. A number in JSON is a float, and the cent
        is lost in serialisation.
      pattern: '^-?\d+\.\d{2}$'
      examples: ["1534.05"]

    Direcao:
      type: string
      enum: [asc, desc]
      default: asc

    StatusDoCliente:
      type: string
      enum: [active, inactive]

    StatusDaCobranca:
      type: string
      description: The two stored values. "Overdue" is derived, not stored.
      enum: [pending, paid]

    Mensagem:
      type: object
      properties:
        message:
          type: string

    ErroDeValidacao:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, viewer]
        role_label:
          type: string
          description: A Portuguese label, coming from the backend enum.
          examples: ["Consulta"]
        can_write:
          type: boolean
          description: |
            Whether the role can create, edit, import and record a payment. The
            screen uses this to hide what is pointless to offer — it is
            convenience, not a barrier: the backend refuses the operation either
            way, with a 403.
            

    Customer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        document:
          type: string
          description: A CPF (11 digits) or a CNPJ (14), digits only.
        email:
          type: string
          format: email
        status:
          $ref: '#/components/schemas/StatusDoCliente'
        status_label:
          type: string
          description: A Portuguese label, coming from the backend enum so the translation is not duplicated in the frontend.
        created_at:
          type: [string, "null"]
          format: date-time

    CustomerInput:
      type: object
      required: [name, document, email, status]
      properties:
        name:
          type: string
          maxLength: 255
        document:
          type: string
          pattern: '^(\d{11}|\d{14})$'
          description: Digits only. Unique across the base.
        email:
          type: string
          format: email
          maxLength: 255
        status:
          $ref: '#/components/schemas/StatusDoCliente'

    Billing:
      type: object
      properties:
        id:
          type: integer
        description:
          type: string
        original_amount:
          $ref: '#/components/schemas/Dinheiro'
        monthly_interest_rate:
          type: string
          description: A monthly fraction, not a percentage. `"0.0200"` is 2% a month.
        issue_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        payment_date:
          type: [string, "null"]
          format: date
        status:
          $ref: '#/components/schemas/StatusDaCobranca'
        status_label:
          type: string
        is_overdue:
          type: boolean
          description: Derived — pending with the due date in the past. It does not exist as a column.
        paid_amount:
          oneOf:
            - $ref: '#/components/schemas/Dinheiro'
            - type: "null"
          description: Frozen at the moment of payment. Null while pending.
        paid_interest_amount:
          oneOf:
            - $ref: '#/components/schemas/Dinheiro'
            - type: "null"
          description: Interest frozen at the payment date. Null while pending.
        interest_amount:
          $ref: '#/components/schemas/Dinheiro'
        updated_amount:
          $ref: '#/components/schemas/Dinheiro'
        customer:
          $ref: '#/components/schemas/Customer'

    BillingInput:
      type: object
      required: [customer_id, description, original_amount, monthly_interest_rate, issue_date, due_date]
      properties:
        customer_id:
          type: integer
        description:
          type: string
          maxLength: 255
        original_amount:
          type: number
          minimum: 0.01
          maximum: 9999999999.99
        monthly_interest_rate:
          type: number
          minimum: 0
          maximum: 9.9999
          description: A monthly fraction. `0.02` is 2% a month.
        issue_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
          description: It cannot be earlier than the issue date.

    DashboardPeriod:
      type: object
      description: The current month, scoped by due date.
      properties:
        label:
          type: string
          examples: ["Setembro de 2026"]
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        count:
          type: integer
        original_amount:
          $ref: '#/components/schemas/Dinheiro'
        received_amount:
          $ref: '#/components/schemas/Dinheiro'
          description: Soma das colunas congeladas no pagamento.
        pending_amount:
          $ref: '#/components/schemas/Dinheiro'
          description: The UPDATED amount of what is unpaid — interest included.
        interest_amount:
          $ref: '#/components/schemas/Dinheiro'
          description: Interest accrued by the month's overdue billings, up to today.
        overdue_count:
          type: integer

    DashboardMonth:
      type: object
      properties:
        month:
          type: string
          examples: ["2026-09"]
        label:
          type: string
          description: A short label, to fit under the chart's column.
          examples: ["set/26"]
        count:
          type: integer
        original_amount:
          $ref: '#/components/schemas/Dinheiro'
        received_amount:
          $ref: '#/components/schemas/Dinheiro'

    RelatorioDeImportacao:
      type: object
      description: |
        What happened to the file. It exists in this shape because a partial import
        is only acceptable if the user knows what went in and what did not — a
        success counter on its own hides the half that matters.
      properties:
        total_rows:
          type: integer
          description: Data rows, not counting the header.
        valid_count:
          type: integer
        imported_count:
          type: integer
          description: Always 0 on a preview.
        error_count:
          type: integer
        errors_truncated:
          type: boolean
          description: |
            The error list is capped at 50; the count is not. A file with a crooked
            header would produce one error per row, and returning a hundred thousand
            would help nobody.
        errors:
          type: array
          items:
            type: object
            properties:
              line:
                type: integer
                description: The line in the file, counting the header.
              messages:
                type: array
                items:
                  type: string
              values:
                type: object
                additionalProperties:
                  type: string
                description: The row as it arrived, so the user can recognise it.
        sample:
          type: array
          description: The first valid rows, already normalised.
          items:
            type: object
            additionalProperties:
              type: string

    Totais:
      type: object
      description: |
        An aggregation over the whole filtered set, from a query of its own — never
        the sum of the page on display.
      properties:
        count:
          type: integer
        original_amount:
          $ref: '#/components/schemas/Dinheiro'
        interest_amount:
          $ref: '#/components/schemas/Dinheiro'
        updated_amount:
          $ref: '#/components/schemas/Dinheiro'
        paid_amount:
          $ref: '#/components/schemas/Dinheiro'
          description: The sum of the paid billings' frozen columns.
        pending_amount:
          $ref: '#/components/schemas/Dinheiro'
          description: The sum of the unpaid ones' updated amount.

    Filtros:
      type: object
      description: An echo of the applied scope, already normalised.
      properties:
        date_field:
          type: string
        start_date:
          type: [string, "null"]
        end_date:
          type: [string, "null"]
        customer_id:
          type: [integer, "null"]
        status:
          type: [string, "null"]
        sort:
          type: string
        direction:
          type: string

    Paginacao:
      type: object
      description: Laravel's pagination envelope.
      properties:
        links:
          type: object
          properties:
            first:
              type: [string, "null"]
            last:
              type: [string, "null"]
            prev:
              type: [string, "null"]
            next:
              type: [string, "null"]
        meta:
          type: object
          properties:
            current_page:
              type: integer
            from:
              type: [integer, "null"]
            last_page:
              type: integer
            path:
              type: string
            per_page:
              type: integer
            to:
              type: [integer, "null"]
            total:
              type: integer
