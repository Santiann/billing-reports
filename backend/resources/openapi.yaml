# Especificação da API — OpenAPI 3.1
#
# Este arquivo é escrito à mão e verificado por teste. `OpenApiSpecTest` compara
# as operações daqui com as rotas registradas no Laravel nas DUAS direções: rota
# sem entrada falha, e entrada sem rota também. Documentação de API à mão
# apodrece em silêncio, e é esse silêncio que o teste remove.
#
# Os exemplos não foram inventados: saíram de chamadas reais à API, com os
# valores conferidos contra o InterestCalculator.

openapi: 3.1.0

info:
  title: Gerador de Relatórios — API de faturamento
  version: "1.0.0"
  summary: Cobranças, clientes e relatório com juros compostos sobre atraso.
  description: |
    API REST do gerador de relatórios de faturamento. Cobre cadastro de clientes, cadastro e
    pagamento de cobranças, e o relatório de faturamento com exportação.

    ## Autenticação

    Token Sanctum no cabeçalho `Authorization: Bearer <token>`, obtido em
    `POST /api/auth/login`. Todas as rotas exigem o token, exceto o próprio
    login.

    Na aplicação web o token nunca chega ao browser: ele é guardado num cookie
    httpOnly pelo Next.js, que fala com esta API a partir do servidor.

    ## A regra de juros

    Cobrança vencida e não paga acumula **juros compostos**:

        valor_atualizado = valor_original * (1 + taxa_mensal) ^ (dias_atraso / 30)

    Três consequências aparecem nas respostas:

    - `interest_amount` e `updated_amount` vêm calculados do backend em toda
      listagem e em toda cobrança isolada, sempre pela mesma regra.
    - Cobrança **paga não acumula juros**. Os juros congelam na data do
      pagamento, e `paid_amount` e `paid_interest_amount` guardam o valor
      daquele dia — nunca um recálculo.
    - "Vencida" não é status gravado: é `status = pending` com vencimento no
      passado, e chega como o booleano `is_overdue`.

    ## Valores monetários são string

    Todo campo de dinheiro trafega como string decimal (`"1534.05"`), não como
    número. Em JSON, número é ponto flutuante de dupla precisão, e o relatório
    soma milhões de linhas: o centavo se perde na serialização antes mesmo de
    chegar na tela.
  contact:
    name: João Santian
    email: joaosantian1@gmail.com

servers:
  - url: http://localhost:8000
    description: Ambiente do Docker Compose

security:
  - bearerAuth: []

tags:
  - name: Autenticação
    description: Login, logout e sessão corrente.
  - name: Dashboard
    description: Indicadores do mês corrente e série dos últimos doze meses.
  - name: Clientes
    description: Cadastro de clientes. Documento é CPF ou CNPJ, só dígitos.
  - name: Cobranças
    description: Cadastro, edição e registro de pagamento.
  - name: Relatório
    description: |
      Relatório de faturamento por período, com totalizadores sobre o conjunto
      filtrado inteiro — nunca sobre a página exibida — e exportação em CSV e
      PDF.

paths:
  # ----------------------------------------------------------------- auth ---

  /api/auth/login:
    post:
      tags: [Autenticação]
      summary: Autentica e devolve um token
      description: |
        Credenciais erradas respondem **401**, não 422: o payload é válido, o
        que falhou foi a autenticação. A mensagem é a mesma para e-mail
        inexistente e senha errada, para não revelar quais e-mails existem.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
            example:
              email: admin@billing.test
              password: password
      responses:
        200:
          description: Token emitido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
              example:
                token: 25|0NzEwjqYpQAmZcW1dg8kLjLaJ5dEtjBLGdq4AqpL9ff06cb3
                user:
                  id: 1
                  name: Administrador
                  email: admin@billing.test
        401:
          description: Credenciais inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                message: Credenciais inválidas.
        422:
          $ref: '#/components/responses/ErroDeValidacao'

  /api/auth/logout:
    post:
      tags: [Autenticação]
      summary: Revoga o token da sessão corrente
      description: |
        Revoga apenas o token usado nesta chamada. Os outros tokens do mesmo
        usuário continuam valendo — sair no navegador não derruba o celular.
      operationId: logout
      responses:
        200:
          description: Sessão encerrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                message: Sessão encerrada.
        401:
          $ref: '#/components/responses/NaoAutenticado'

  /api/auth/me:
    get:
      tags: [Autenticação]
      summary: Devolve o usuário do token
      description: |
        Usada pelo layout autenticado do frontend para confirmar que o cookie
        ainda corresponde a um token válido. O middleware do Next só olha a
        presença do cookie; quem confirma que ele vale é esta rota.
      operationId: me
      responses:
        200:
          description: Usuário autenticado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
              example:
                user:
                  id: 1
                  name: Administrador
                  email: admin@billing.test
        401:
          $ref: '#/components/responses/NaoAutenticado'

  # ------------------------------------------------------------- dashboard ---

  /api/dashboard:
    get:
      tags: [Dashboard]
      summary: Indicadores do mês e série de doze meses
      description: |
        A tela inicial numa chamada. Duas agregações no banco, nenhuma linha
        carregada para somar em memória.

        `period` recorta o **mês corrente por vencimento** — o que vence agora,
        o que já entrou e o que falta entrar. `monthly` traz os últimos doze
        meses, incluindo o corrente, para o gráfico de faturado contra recebido.

        Duas leituras que valem para os dois blocos:

        - **`received_amount` vem das colunas congeladas**, nunca de recálculo.
          É a mesma regra do relatório, e o dashboard não pode discordar dele.
        - **`pending_amount` já inclui os juros de hoje**: é o valor atualizado
          do que não foi pago, não a soma dos valores originais.

        Medido contra 2.000.000 de cobranças: 0,66s a 0,93s.
      operationId: dashboard
      responses:
        200:
          description: Indicadores e série.
          content:
            application/json:
              schema:
                type: object
                properties:
                  period:
                    $ref: '#/components/schemas/DashboardPeriod'
                  monthly:
                    type: array
                    items:
                      $ref: '#/components/schemas/DashboardMonth'
              example:
                period:
                  label: Setembro de 2026
                  start_date: "2026-09-01"
                  end_date: "2026-09-30"
                  count: 54926
                  original_amount: "278768833.46"
                  received_amount: "111606598.70"
                  pending_amount: "167554107.67"
                  interest_amount: "343072.66"
                  overdue_count: 11890
                monthly:
                  - month: "2026-08"
                    label: ago/26
                    count: 56389
                    original_amount: "284730191.31"
                    received_amount: "115024428.54"
                  - month: "2026-09"
                    label: set/26
                    count: 54926
                    original_amount: "278768833.46"
                    received_amount: "111606598.70"
        401:
          $ref: '#/components/responses/NaoAutenticado'

  # ------------------------------------------------------------- clientes ---

  /api/customers:
    get:
      tags: [Clientes]
      summary: Lista clientes
      description: |
        Busca, filtro, ordenação e paginação acontecem **no banco**. O termo de
        busca casa nome e e-mail por `LIKE`, e casa documento apenas se o termo
        tiver dígitos — sem essa guarda, um termo textual viraria
        `document LIKE '%'` e traria a tabela inteira.
      operationId: listarClientes
      parameters:
        - name: search
          in: query
          description: Nome, e-mail ou documento.
          schema:
            type: string
            maxLength: 255
          example: silva
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/StatusDoCliente'
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, document, email, status, created_at]
            default: name
        - name: direction
          in: query
          schema:
            $ref: '#/components/schemas/Direcao'
        - name: per_page
          in: query
          description: Teto de 100. Sem teto, `per_page=999999` derrubaria a API.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        200:
          description: Página de clientes.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Customer'
                  - $ref: '#/components/schemas/Paginacao'
              example:
                data:
                  - id: 1
                    name: Comércio Silva LTDA
                    document: "12345678000190"
                    email: financeiro@silva.test
                    status: active
                    status_label: Ativo
                    created_at: "2026-09-12T04:42:44+00:00"
                links:
                  first: http://localhost:8000/api/customers?page=1
                  last: http://localhost:8000/api/customers?page=1
                  prev: null
                  next: null
                meta:
                  current_page: 1
                  from: 1
                  last_page: 1
                  path: http://localhost:8000/api/customers
                  per_page: 15
                  to: 1
                  total: 1
        401:
          $ref: '#/components/responses/NaoAutenticado'
        422:
          $ref: '#/components/responses/ErroDeValidacao'

    post:
      tags: [Clientes]
      summary: Cadastra um cliente
      description: |
        O documento é gravado **só com dígitos**: guardar com máscara faria a
        busca depender do formato digitado. CPF tem 11 dígitos e CNPJ tem 14;
        nada entre os dois é aceito, e o documento é único na base.
      operationId: criarCliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
            example:
              name: Comércio Silva LTDA
              document: "12345678000190"
              email: financeiro@silva.test
              status: active
      responses:
        201:
          description: Cliente criado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Customer'
              example:
                data:
                  id: 1
                  name: Comércio Silva LTDA
                  document: "12345678000190"
                  email: financeiro@silva.test
                  status: active
                  status_label: Ativo
                  created_at: "2026-09-12T04:42:44+00:00"
        401:
          $ref: '#/components/responses/NaoAutenticado'
        403:
          $ref: '#/components/responses/PerfilSemPermissao'
        422:
          description: |
            Validação falhou. Os erros vêm campo a campo, que é o que permite ao
            formulário marcar o campo errado em vez de mostrar um aviso solto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
              example:
                message: O campo nome é obrigatório. (and 3 more errors)
                errors:
                  name:
                    - O campo nome é obrigatório.
                  document:
                    - O documento deve ser um CPF (11 dígitos) ou CNPJ (14 dígitos).
                  email:
                    - O campo e-mail deve ser um e-mail válido.
                  status:
                    - O valor selecionado em status é inválido.

  /api/customers/import:
    post:
      tags: [Clientes]
      summary: Importa clientes de um arquivo CSV
      description: |
        Duas etapas no mesmo endpoint. Com `?preview=1` o arquivo é analisado e
        **nada é gravado** — a resposta diz o que aconteceria. Sem o parâmetro,
        as linhas válidas são importadas.

        **Importação parcial é o comportamento esperado**, não uma falha: linha
        com erro não impede as outras de entrar. As válidas entram e as
        recusadas voltam em `errors`, com o número da linha **do arquivo**
        (contando o cabeçalho, que é como o usuário vai encontrá-la na planilha)
        e o motivo.

        O arquivo é lido linha a linha, então o tamanho dele não precisa caber
        na memória do processo. A gravação vai em lotes de 500, com os
        documentos do lote conferidos contra o banco numa consulta só.

        Sobre o formato: o separador é detectado — `;` do Excel em português ou
        `,` — e o cabeçalho aceita apelidos (`nome` ou `name`, `documento` ou
        `cpf`). O documento pode vir com máscara; ela é removida. Status vazio
        assume ativo.

        Arquivo sem as colunas obrigatórias é recusado **inteiro**, com 422: não
        há o que importar parcialmente quando nem dá para saber o que é cada
        coluna.
      operationId: importarClientes
      parameters:
        - name: preview
          in: query
          description: Analisa sem gravar.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV de até 20 MB.
      responses:
        200:
          description: |
            Relatório do que aconteceu — ou do que aconteceria, na prévia.
            `imported_count` é sempre 0 quando `preview=1`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatorioDeImportacao'
              example:
                total_rows: 5
                valid_count: 3
                imported_count: 3
                error_count: 2
                errors_truncated: false
                errors:
                  - line: 4
                    messages:
                      - O documento deve ser um CPF (11 dígitos) ou CNPJ (14 dígitos).
                    values:
                      name: Documento Curto ME
                      document: "123"
                      email: curto@exemplo.test
                      status: ativo
                  - line: 6
                    messages:
                      - O campo e-mail é obrigatório.
                    values:
                      name: Sem Email LTDA
                      document: "44555666000177"
                      email: ""
                      status: ativo
                sample:
                  - name: Comércio Silva LTDA
                    document: "12345678000190"
                    email: financeiro@silva.test
                    status: active
        401:
          $ref: '#/components/responses/NaoAutenticado'
        403:
          $ref: '#/components/responses/PerfilSemPermissao'
        422:
          description: |
            O arquivo não serve: não é CSV, passa do tamanho, ou o cabeçalho não
            tem as colunas obrigatórias.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
              example:
                message: "O arquivo precisa das colunas: documento, email. Cabeçalho recebido: nome, telefone."
                errors:
                  file:
                    - "O arquivo precisa das colunas: documento, email. Cabeçalho recebido: nome, telefone."

  /api/customers/{customer}:
    parameters:
      - $ref: '#/components/parameters/IdDoCliente'
    get:
      tags: [Clientes]
      summary: Exibe um cliente
      operationId: exibirCliente
      responses:
        200:
          description: Cliente encontrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Customer'
              example:
                data:
                  id: 1
                  name: Comércio Silva LTDA
                  document: "12345678000190"
                  email: financeiro@silva.test
                  status: active
                  status_label: Ativo
                  created_at: "2026-09-12T04:42:44+00:00"
        401:
          $ref: '#/components/responses/NaoAutenticado'
        404:
          $ref: '#/components/responses/NaoEncontrado'

    put:
      tags: [Clientes]
      summary: Atualiza um cliente
      description: |
        A unicidade do documento ignora o próprio registro — sem isso ninguém
        salvaria uma edição sem antes trocar de documento.
      operationId: atualizarCliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
            example:
              name: Comércio Silva LTDA
              document: "12345678000190"
              email: contato@silva.test
              status: inactive
      responses:
        200:
          description: Cliente atualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Customer'
              example:
                data:
                  id: 1
                  name: Comércio Silva LTDA
                  document: "12345678000190"
                  email: contato@silva.test
                  status: inactive
                  status_label: Inativo
                  created_at: "2026-09-12T04:42:44+00:00"
        401:
          $ref: '#/components/responses/NaoAutenticado'
        403:
          $ref: '#/components/responses/PerfilSemPermissao'
        404:
          $ref: '#/components/responses/NaoEncontrado'
        422:
          $ref: '#/components/responses/ErroDeValidacao'

    patch:
      tags: [Clientes]
      summary: Atualiza um cliente (mesmo contrato do PUT)
      description: |
        A rota aceita os dois verbos e aplica as mesmas regras: os campos
        continuam todos obrigatórios. Está documentado porque está registrado —
        `PATCH` aqui não é atualização parcial.
      operationId: atualizarClienteParcial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
            example:
              name: Comércio Silva LTDA
              document: "12345678000190"
              email: contato@silva.test
              status: inactive
      responses:
        200:
          description: Cliente atualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Customer'
              example:
                data:
                  id: 1
                  name: Comércio Silva LTDA
                  document: "12345678000190"
                  email: contato@silva.test
                  status: inactive
                  status_label: Inativo
                  created_at: "2026-09-12T04:42:44+00:00"
        401:
          $ref: '#/components/responses/NaoAutenticado'
        403:
          $ref: '#/components/responses/PerfilSemPermissao'
        404:
          $ref: '#/components/responses/NaoEncontrado'
        422:
          $ref: '#/components/responses/ErroDeValidacao'

  # ------------------------------------------------------------ cobranças ---

  /api/billings:
    get:
      tags: [Cobranças]
      summary: Lista cobranças
      description: |
        `interest_amount` e `updated_amount` saem do próprio `SELECT`, pela face
        SQL do cálculo de juros. É isso que permite ordenar por valor atualizado
        sem carregar o conjunto em memória.

        O cliente vem junto por eager loading: sem isso, serializar uma página
        de 15 linhas dispararia 15 consultas.
      operationId: listarCobrancas
      parameters:
        - name: customer_id
          in: query
          schema:
            type: integer
          example: 1
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/StatusDaCobranca'
        - name: search
          in: query
          description: Trecho da descrição.
          schema:
            type: string
            maxLength: 255
        - name: sort
          in: query
          schema:
            type: string
            enum: [id, due_date, issue_date, original_amount, created_at]
            default: id
        - name: direction
          in: query
          schema:
            $ref: '#/components/schemas/Direcao'
            default: desc
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        200:
          description: Página de cobranças.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Billing'
                  - $ref: '#/components/schemas/Paginacao'
              example:
                data:
                  - id: 1
                    description: Mensalidade de agosto
                    original_amount: "1500.00"
                    monthly_interest_rate: "0.0200"
                    issue_date: "2026-07-10"
                    due_date: "2026-08-09"
                    payment_date: null
                    status: pending
                    status_label: Pendente
                    is_overdue: true
                    paid_amount: null
                    paid_interest_amount: null
                    interest_amount: "34.05"
                    updated_amount: "1534.05"
                    customer:
                      id: 1
                      name: Comércio Silva LTDA
                      document: "12345678000190"
                      email: financeiro@silva.test
                      status: active
                      status_label: Ativo
                      created_at: "2026-09-12T04:42:44+00:00"
                links:
                  first: http://localhost:8000/api/billings?page=1
                  last: http://localhost:8000/api/billings?page=1
                  prev: null
                  next: null
                meta:
                  current_page: 1
                  from: 1
                  last_page: 1
                  path: http://localhost:8000/api/billings
                  per_page: 15
                  to: 1
                  total: 1
        401:
          $ref: '#/components/responses/NaoAutenticado'
        422:
          $ref: '#/components/responses/ErroDeValidacao'

    post:
      tags: [Cobranças]
      summary: Cadastra uma cobrança
      description: |
        `status` e os campos de pagamento **não são aceitos** aqui, mesmo que
        enviados. Toda cobrança nasce pendente: aceitar `status: paid` criaria
        uma cobrança paga sem os valores congelados, e quem faz essa transição é
        `POST /api/billings/{billing}/payment`.

        A taxa é fração mensal, não porcentagem: `0.02` é 2% ao mês.
      operationId: criarCobranca
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingInput'
            example:
              customer_id: 1
              description: Mensalidade de agosto
              original_amount: 1500.00
              monthly_interest_rate: 0.02
              issue_date: "2026-07-10"
              due_date: "2026-08-09"
      responses:
        201:
          description: Cobrança criada, sempre pendente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Billing'
              example:
                data:
                  id: 1
                  description: Mensalidade de agosto
                  original_amount: "1500.00"
                  monthly_interest_rate: "0.0200"
                  issue_date: "2026-07-10"
                  due_date: "2026-08-09"
                  payment_date: null
                  status: pending
                  status_label: Pendente
                  is_overdue: true
                  paid_amount: null
                  paid_interest_amount: null
                  interest_amount: "34.05"
                  updated_amount: "1534.05"
        401:
          $ref: '#/components/responses/NaoAutenticado'
        403:
          $ref: '#/components/responses/PerfilSemPermissao'
        422:
          description: Validação falhou.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
              example:
                message: O campo data de vencimento deve ser uma data posterior ou igual a data de emissão.
                errors:
                  due_date:
                    - O campo data de vencimento deve ser uma data posterior ou igual a data de emissão.

  /api/billings/import:
    post:
      tags: [Cobranças]
      summary: Importa cobranças de um arquivo CSV
      description: |
        Mesma mecânica da importação de clientes — `?preview=1` analisa sem
        gravar, importação parcial é o comportamento esperado, e as linhas
        recusadas voltam com o número da linha do arquivo e o motivo — com duas
        regras próprias.

        **O cliente é resolvido pelo documento**, que precisa já estar
        cadastrado. O arquivo vem de fora e não conhece o id interno; documento
        é a identidade de negócio que as duas pontas têm. Linha cujo documento
        não existe falha sozinha, sem impedir as outras.

        **A cobrança nasce pendente**, como a cadastrada pela tela. Coluna de
        status ou de valor pago no arquivo é **ignorada**, não aceita: aceitar
        `paid` criaria cobrança paga sem os valores congelados, e quem faz essa
        transição é `POST /api/billings/{billing}/payment`.

        Formatos aceitos, porque o arquivo costuma sair de planilha: valor como
        `1.234,56` ou `1234.56`, data como `09/08/2026` ou `2026-08-09`, taxa
        como `0,02`. Taxa ausente vira zero — cobrança sem juros é legítima.

        Ao contrário de cliente, **linhas idênticas geram duas cobranças**:
        cobrança não tem chave natural, e duas mensalidades do mesmo cliente com
        o mesmo vencimento são duas cobranças de verdade.
      operationId: importarCobrancas
      parameters:
        - name: preview
          in: query
          description: Analisa sem gravar.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    CSV com as colunas documento, descricao, valor, emissao e
                    vencimento. A taxa é opcional.
      responses:
        200:
          description: Relatório do que aconteceu — ou do que aconteceria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatorioDeImportacao'
              example:
                total_rows: 5
                valid_count: 3
                imported_count: 3
                error_count: 2
                errors_truncated: false
                errors:
                  - line: 4
                    messages:
                      - O vencimento não pode ser anterior à emissão.
                    values:
                      document: "12345678000190"
                      description: Vencimento invertido
                  - line: 5
                    messages:
                      - Nenhum cliente cadastrado com este documento.
                    values:
                      document: "00000000000000"
                      description: Cliente que não existe
                sample:
                  - document: "12345678000190"
                    description: Mensalidade de setembro
                    original_amount: "1500.00"
                    monthly_interest_rate: "0.02"
                    issue_date: "2026-08-10"
                    due_date: "2026-09-09"
        401:
          $ref: '#/components/responses/NaoAutenticado'
        403:
          $ref: '#/components/responses/PerfilSemPermissao'
        422:
          description: |
            O arquivo não serve: não é CSV, passa do tamanho, ou o cabeçalho não
            tem as colunas obrigatórias.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
              example:
                message: "O arquivo precisa das colunas: valor, emissao, vencimento. Cabeçalho recebido: documento, descricao."
                errors:
                  file:
                    - "O arquivo precisa das colunas: valor, emissao, vencimento. Cabeçalho recebido: documento, descricao."

  /api/billings/{billing}:
    parameters:
      - $ref: '#/components/parameters/IdDaCobranca'
    get:
      tags: [Cobranças]
      summary: Exibe uma cobrança
      description: |
        Numa cobrança isolada os juros são calculados em PHP, e não pelo
        `SELECT` como na listagem. Existe teste afirmando que os dois caminhos
        devolvem o mesmo valor até o centavo — é o que sustenta a exigência de
        resultado consistente entre telas e relatório.
      operationId: exibirCobranca
      responses:
        200:
          description: Cobrança encontrada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Billing'
              example:
                data:
                  id: 1
                  description: Mensalidade de agosto
                  original_amount: "1500.00"
                  monthly_interest_rate: "0.0200"
                  issue_date: "2026-07-10"
                  due_date: "2026-08-09"
                  payment_date: "2026-09-08"
                  status: paid
                  status_label: Paga
                  is_overdue: false
                  paid_amount: "1530.00"
                  paid_interest_amount: "30.00"
                  interest_amount: "30.00"
                  updated_amount: "1530.00"
        401:
          $ref: '#/components/responses/NaoAutenticado'
        404:
          $ref: '#/components/responses/NaoEncontrado'

    put:
      tags: [Cobranças]
      summary: Atualiza uma cobrança pendente
      description: |
        **Cobrança paga é imutável.** Alterar valor ou taxa depois do pagamento
        invalidaria `paid_amount` e `paid_interest_amount`, que foram congelados
        na data do pagamento e não são recalculáveis — o cálculo é função da
        data de então. A tentativa responde 422.
      operationId: atualizarCobranca
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingInput'
            example:
              customer_id: 1
              description: Mensalidade de agosto (revisada)
              original_amount: 1600.00
              monthly_interest_rate: 0.02
              issue_date: "2026-07-10"
              due_date: "2026-08-09"
      responses:
        200:
          description: Cobrança atualizada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Billing'
              example:
                data:
                  id: 1
                  description: Mensalidade de agosto (revisada)
                  original_amount: "1600.00"
                  monthly_interest_rate: "0.0200"
                  issue_date: "2026-07-10"
                  due_date: "2026-08-09"
                  payment_date: null
                  status: pending
                  status_label: Pendente
                  is_overdue: true
                  paid_amount: null
                  paid_interest_amount: null
                  interest_amount: "36.32"
                  updated_amount: "1636.32"
        401:
          $ref: '#/components/responses/NaoAutenticado'
        403:
          $ref: '#/components/responses/PerfilSemPermissao'
        404:
          $ref: '#/components/responses/NaoEncontrado'
        422:
          description: Validação falhou, ou a cobrança já está paga.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
              example:
                message: Uma cobrança paga não pode ser editada.
                errors:
                  status:
                    - Uma cobrança paga não pode ser editada.

    patch:
      tags: [Cobranças]
      summary: Atualiza uma cobrança pendente (mesmo contrato do PUT)
      description: |
        A rota aceita os dois verbos e aplica as mesmas regras, inclusive a de
        que cobrança paga é imutável.
      operationId: atualizarCobrancaParcial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingInput'
            example:
              customer_id: 1
              description: Mensalidade de agosto (revisada)
              original_amount: 1600.00
              monthly_interest_rate: 0.02
              issue_date: "2026-07-10"
              due_date: "2026-08-09"
      responses:
        200:
          description: Cobrança atualizada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Billing'
              example:
                data:
                  id: 1
                  description: Mensalidade de agosto (revisada)
                  original_amount: "1600.00"
                  monthly_interest_rate: "0.0200"
                  issue_date: "2026-07-10"
                  due_date: "2026-08-09"
                  payment_date: null
                  status: pending
                  status_label: Pendente
                  is_overdue: true
                  paid_amount: null
                  paid_interest_amount: null
                  interest_amount: "36.32"
                  updated_amount: "1636.32"
        401:
          $ref: '#/components/responses/NaoAutenticado'
        403:
          $ref: '#/components/responses/PerfilSemPermissao'
        404:
          $ref: '#/components/responses/NaoEncontrado'
        422:
          $ref: '#/components/responses/ErroDeValidacao'

  /api/billings/{billing}/payment:
    parameters:
      - $ref: '#/components/parameters/IdDaCobranca'
    post:
      tags: [Cobranças]
      summary: Registra o pagamento e congela os juros
      description: |
        Os juros são calculados **na data do pagamento**, não em hoje: pagar com
        data retroativa produz o valor daquele dia. A partir daqui a cobrança
        para de acumular, e o valor exibido vem das colunas gravadas.

        Os dois campos são opcionais:

        - `payment_date` ausente assume hoje. Não pode ser futura — juros são
          função da data, e aceitar data futura gravaria um congelamento que
          ainda não ocorreu — nem anterior à emissão.
        - `paid_amount` ausente assume o valor atualizado. Informá-lo cobre
          acordo e desconto; os juros calculados continuam registrados em
          `paid_interest_amount` de qualquer forma.

        ## Idempotência

        Esta é a única operação idempotente da API, porque é a única em que
        repetir cobra duas vezes. Mandando `Idempotency-Key`, a segunda chamada
        **devolve o resultado da primeira** em vez de processar de novo — com
        `Idempotent-Replay: true` no cabeçalho da resposta, para quem chama
        distinguir "pagou agora" de "já tinha pago".

        A resposta guardada é a que a primeira chamada produziu, seja ela qual
        for: um 422 de validação se repete como 422. Um 500 **não** é guardado,
        porque depois de um erro de servidor o certo é tentar de novo.

        Três situações que a chave não cobre, e não deve:

        - **Sem o cabeçalho, nada muda.** Pagar uma cobrança já paga continua
          respondendo 422. Idempotência serve a quem repete a mesma operação;
          transformar toda segunda tentativa em sucesso esconderia um erro real.
        - **Mesma chave com outro conteúdo responde 422.** Inclui usar a mesma
          chave em outra cobrança. É bug de quem chama, e devolver o resultado
          antigo esconderia o bug.
        - **A chave vale 24 horas.** Depois disso ela é uma chave nova.
      operationId: registrarPagamento
      parameters:
        - $ref: '#/components/parameters/ChaveDeIdempotencia'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_date:
                  type: [string, "null"]
                  format: date
                  description: Data do pagamento. Ausente assume hoje.
                paid_amount:
                  type: [string, "null"]
                  description: Valor recebido. Ausente assume o valor atualizado.
            example:
              payment_date: "2026-09-08"
      responses:
        200:
          description: |
            Pagamento registrado. No exemplo, R$ 1.500,00 a 2% ao mês com 30
            dias de atraso: `1500 * 1.02^1 = 1530,00`, dos quais R$ 30,00 são
            juros — e esses números não mudam mais.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Billing'
              example:
                data:
                  id: 1
                  description: Mensalidade de agosto
                  original_amount: "1500.00"
                  monthly_interest_rate: "0.0200"
                  issue_date: "2026-07-10"
                  due_date: "2026-08-09"
                  payment_date: "2026-09-08"
                  status: paid
                  status_label: Paga
                  is_overdue: false
                  paid_amount: "1530.00"
                  paid_interest_amount: "30.00"
                  interest_amount: "30.00"
                  updated_amount: "1530.00"
        401:
          $ref: '#/components/responses/NaoAutenticado'
        403:
          $ref: '#/components/responses/PerfilSemPermissao'
        404:
          $ref: '#/components/responses/NaoEncontrado'
        409:
          $ref: '#/components/responses/RequisicaoEmAndamento'
        422:
          description: |
            Data inválida, valor inválido, a cobrança já está paga — ou a chave
            de idempotência já foi usada para outra requisição, que vem sem o
            bloco `errors` por não ser erro de campo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
              example:
                message: Esta cobrança já está paga.
                errors:
                  status:
                    - Esta cobrança já está paga.

  # ------------------------------------------------------------ relatório ---

  /api/reports/billings:
    get:
      tags: [Relatório]
      summary: Relatório de faturamento por período
      description: |
        Além da página de cobranças, a resposta traz três blocos:

        - **`totals`** — agregação sobre o conjunto filtrado **inteiro**, de
          consulta própria. Não é a soma da página: quem está na página 3 de um
          relatório de mil cobranças precisa do total do relatório.
        - **`filters`** — eco do recorte aplicado, já normalizado. A tela
          reexibe e as exportações imprimem no cabeçalho do arquivo a partir
          desta mesma fonte.
        - **`export`** — o teto do PDF e se o recorte corrente cabe nele, para a
          tela desabilitar o botão **antes** do clique em vez de mandar o
          usuário para um 422.

        O período pode ser recortado por emissão, vencimento ou pagamento, à
        escolha de quem consulta — cada uma tem índice próprio.
      operationId: relatorioDeFaturamento
      parameters:
        - $ref: '#/components/parameters/BaseDaData'
        - $ref: '#/components/parameters/InicioDoPeriodo'
        - $ref: '#/components/parameters/FimDoPeriodo'
        - $ref: '#/components/parameters/ClienteDoRelatorio'
        - $ref: '#/components/parameters/StatusDoRelatorio'
        - name: sort
          in: query
          schema:
            type: string
            enum: [issue_date, due_date, payment_date, original_amount, interest_amount, updated_amount]
            default: due_date
          description: |
            Ordenar por `updated_amount` ou `interest_amount` só é possível
            porque o cálculo existe em SQL.
        - name: direction
          in: query
          schema:
            $ref: '#/components/schemas/Direcao'
            default: desc
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        200:
          description: Página do relatório, com totalizadores do conjunto inteiro.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Billing'
                      totals:
                        $ref: '#/components/schemas/Totais'
                      filters:
                        $ref: '#/components/schemas/Filtros'
                      export:
                        type: object
                        properties:
                          pdf_max_rows:
                            type: integer
                          pdf_available:
                            type: boolean
                  - $ref: '#/components/schemas/Paginacao'
              example:
                data:
                  - id: 1
                    description: Mensalidade de agosto
                    original_amount: "1500.00"
                    monthly_interest_rate: "0.0200"
                    issue_date: "2026-07-10"
                    due_date: "2026-08-09"
                    payment_date: null
                    status: pending
                    status_label: Pendente
                    is_overdue: true
                    paid_amount: null
                    paid_interest_amount: null
                    interest_amount: "34.05"
                    updated_amount: "1534.05"
                    customer:
                      id: 1
                      name: Comércio Silva LTDA
                      document: "12345678000190"
                      email: financeiro@silva.test
                      status: active
                      status_label: Ativo
                      created_at: "2026-09-12T04:42:44+00:00"
                links:
                  first: http://localhost:8000/api/reports/billings?page=1
                  last: http://localhost:8000/api/reports/billings?page=1
                  prev: null
                  next: null
                meta:
                  current_page: 1
                  from: 1
                  last_page: 1
                  path: http://localhost:8000/api/reports/billings
                  per_page: 25
                  to: 1
                  total: 1
                totals:
                  count: 1
                  original_amount: "1500.00"
                  interest_amount: "34.05"
                  updated_amount: "1534.05"
                  paid_amount: "0.00"
                  pending_amount: "1534.05"
                filters:
                  date_field: due_date
                  start_date: null
                  end_date: null
                  customer_id: null
                  status: null
                  sort: due_date
                  direction: desc
                export:
                  pdf_max_rows: 1000
                  pdf_available: true
        401:
          $ref: '#/components/responses/NaoAutenticado'
        422:
          description: Filtro inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDeValidacao'
              example:
                message: A data final não pode ser anterior à inicial.
                errors:
                  end_date:
                    - A data final não pode ser anterior à inicial.

  /api/reports/billings/csv:
    get:
      tags: [Relatório]
      summary: Exporta o relatório em CSV
      description: |
        **Sem limite de linhas.** O arquivo é escrito linha a linha enquanto o
        resultado é percorrido, e em nenhum momento o conjunto existe inteiro em
        memória — é o que permite exportar centenas de milhares de cobranças.

        Aceita exatamente os mesmos filtros da tela, validados pelo mesmo
        objeto: o arquivo é o relatório que está na tela, não uma segunda
        consulta parecida. Período, filtros e totalizadores são impressos no
        próprio arquivo.

        Separador `;` e BOM UTF-8, porque o destino é o Excel — sem o BOM ele
        abre o arquivo como Latin-1 e os acentos viram lixo.
      operationId: exportarRelatorioCsv
      parameters:
        - $ref: '#/components/parameters/BaseDaData'
        - $ref: '#/components/parameters/InicioDoPeriodo'
        - $ref: '#/components/parameters/FimDoPeriodo'
        - $ref: '#/components/parameters/ClienteDoRelatorio'
        - $ref: '#/components/parameters/StatusDoRelatorio'
      responses:
        200:
          description: Arquivo CSV, em stream.
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="relatorio-faturamento-2026-09-12-044244.csv"
          content:
            text/csv:
              schema:
                type: string
              example: |
                Relatório de faturamento
                Base do período;Data de vencimento
                Status;Todos
                Cliente;Descrição;Emissão;Vencimento;Pagamento;Valor original;Juros;Valor atualizado;Status
                Comércio Silva LTDA;Mensalidade de agosto;10/07/2026;09/08/2026;;1500,00;34,05;1534,05;Vencida
                TOTAIS;;;;;1500,00;34,05;1534,05;
        401:
          $ref: '#/components/responses/NaoAutenticado'
        422:
          $ref: '#/components/responses/ErroDeValidacao'

  /api/reports/billings/pdf:
    get:
      tags: [Relatório]
      summary: Exporta o relatório em PDF
      description: |
        **Tem teto de linhas, e isso é decisão de projeto.** PDF precisa ser
        paginado e montado inteiro antes de ser entregue, então não existe
        versão em streaming como a do CSV. Acima do teto a API responde 422
        orientando o CSV, em vez de estourar a memória do processo.

        O teto saiu de medição contra a base real, com nove colunas:

        | Linhas | Memória | Tempo |
        |---|---|---|
        | 500 | 184 MB | 9,6s |
        | 1.000 | 420 MB | 17,9s |
        | 2.000 | 1.164 MB | 56,5s |
        | 3.500 | 2.965 MB | 210,0s |
        | 5.000 | estourou 3 GB | — |

        O crescimento é superlinear: dobrar as linhas quase triplica a memória.
        Daí o teto em 1.000.

        A contagem que decide isso vem da consulta de totalizadores, antes de
        qualquer linha ser carregada — descobrir que são linhas demais não custa
        carregar linha nenhuma.
      operationId: exportarRelatorioPdf
      parameters:
        - $ref: '#/components/parameters/BaseDaData'
        - $ref: '#/components/parameters/InicioDoPeriodo'
        - $ref: '#/components/parameters/FimDoPeriodo'
        - $ref: '#/components/parameters/ClienteDoRelatorio'
        - $ref: '#/components/parameters/StatusDoRelatorio'
      responses:
        200:
          description: Documento PDF.
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="relatorio-faturamento-2026-09-12-044244.pdf"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        401:
          $ref: '#/components/responses/NaoAutenticado'
        422:
          description: |
            O recorte excede o teto de linhas do PDF. A resposta traz a
            contagem e o limite para a tela poder explicar o que houve, e a
            mensagem indica o caminho que funciona.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  count:
                    type: integer
                  limit:
                    type: integer
              example:
                message: O relatório tem 56.680 cobranças e o limite do PDF é 1.000. Use a exportação em CSV, que não tem limite.
                count: 56680
                limit: 1000

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token Sanctum obtido em `POST /api/auth/login`.

  parameters:
    IdDoCliente:
      name: customer
      in: path
      required: true
      description: ID do cliente.
      schema:
        type: integer
      example: 1

    IdDaCobranca:
      name: billing
      in: path
      required: true
      description: ID da cobrança.
      schema:
        type: integer
      example: 1

    BaseDaData:
      name: date_field
      in: query
      description: |
        Qual das três datas define o período. Cada uma tem índice próprio, e a
        escolha muda o recorte: a mesma cobrança entra num período por emissão e
        em outro por vencimento.
      schema:
        type: string
        enum: [issue_date, due_date, payment_date]
        default: due_date

    InicioDoPeriodo:
      name: start_date
      in: query
      schema:
        type: string
        format: date
      example: "2026-01-01"

    FimDoPeriodo:
      name: end_date
      in: query
      description: Não pode ser anterior a `start_date`.
      schema:
        type: string
        format: date
      example: "2026-12-31"

    ClienteDoRelatorio:
      name: customer_id
      in: query
      schema:
        type: integer
      example: 1

    StatusDoRelatorio:
      name: status
      in: query
      description: |
        `overdue` não é status gravado: é a condição derivada de pendente com
        vencimento no passado. `pending` traz as vencidas junto, porque vencida
        é um caso de pendente.
      schema:
        type: string
        enum: [pending, paid, overdue]

    ChaveDeIdempotencia:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Identifica a operação para que repeti-la não a execute duas vezes.

        Opcional, e o nome vem do rascunho da IETF
        (`draft-ietf-httpapi-idempotency-key-header`). Qualquer string única de
        até 255 caracteres serve — um UUID v4 é a escolha natural. O escopo é
        por usuário: dois clientes podem sortear a mesma chave sem se enxergar.
      schema:
        type: string
        maxLength: 255
      example: 6f1b2c4a-9e77-4d2f-9a0a-1c3b5d7e9f11

  responses:
    NaoAutenticado:
      description: Token ausente, inválido ou revogado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Mensagem'
          example:
            message: Unauthenticated.

    PerfilSemPermissao:
      description: |
        O perfil do usuário é de consulta e não escreve. Esta é a barreira real:
        esconder o botão na tela é conveniência para quem não pode usá-lo, e
        quem sabe o endereço do endpoint chega nele sem passar por tela nenhuma.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Mensagem'
          example:
            message: Seu perfil é de consulta e não permite esta operação.

    NaoEncontrado:
      description: O registro não existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Mensagem'
          example:
            message: Registro não encontrado.

    RequisicaoEmAndamento:
      description: |
        Outra requisição com esta mesma chave de idempotência ainda está sendo
        processada. É a resposta do clique duplo rápido, em que a segunda
        requisição chega antes de a primeira terminar — e é ela que impede as
        duas de processarem.

        Não é falha: tente de novo em alguns instantes e a resposta guardada
        pela primeira virá.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Mensagem'
          example:
            message: Uma requisição com esta chave de idempotência ainda está em andamento.

    ErroDeValidacao:
      description: |
        Validação falhou. Os erros vêm campo a campo, que é o que permite ao
        formulário marcar o campo errado em vez de mostrar um aviso solto.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroDeValidacao'
          example:
            message: O campo nome é obrigatório.
            errors:
              name:
                - O campo nome é obrigatório.

  schemas:
    Dinheiro:
      type: string
      description: |
        Decimal com dois dígitos, como string. Número em JSON é ponto flutuante,
        e o centavo se perde na serialização.
      pattern: '^-?\d+\.\d{2}$'
      examples: ["1534.05"]

    Direcao:
      type: string
      enum: [asc, desc]
      default: asc

    StatusDoCliente:
      type: string
      enum: [active, inactive]

    StatusDaCobranca:
      type: string
      description: Os dois valores gravados. "Vencida" é derivada, não gravada.
      enum: [pending, paid]

    Mensagem:
      type: object
      properties:
        message:
          type: string

    ErroDeValidacao:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, viewer]
        role_label:
          type: string
          description: Rótulo em português, vindo do enum do backend.
          examples: ["Consulta"]
        can_write:
          type: boolean
          description: |
            Se o perfil pode criar, editar, importar e registrar pagamento. A
            tela usa isto para esconder o que não adianta oferecer — é
            conveniência, não barreira: o backend recusa a operação de qualquer
            forma, com 403.
            

    Customer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        document:
          type: string
          description: CPF (11 dígitos) ou CNPJ (14), só dígitos.
        email:
          type: string
          format: email
        status:
          $ref: '#/components/schemas/StatusDoCliente'
        status_label:
          type: string
          description: Rótulo em português, vindo do enum do backend para não duplicar tradução no frontend.
        created_at:
          type: [string, "null"]
          format: date-time

    CustomerInput:
      type: object
      required: [name, document, email, status]
      properties:
        name:
          type: string
          maxLength: 255
        document:
          type: string
          pattern: '^(\d{11}|\d{14})$'
          description: Só dígitos. Único na base.
        email:
          type: string
          format: email
          maxLength: 255
        status:
          $ref: '#/components/schemas/StatusDoCliente'

    Billing:
      type: object
      properties:
        id:
          type: integer
        description:
          type: string
        original_amount:
          $ref: '#/components/schemas/Dinheiro'
        monthly_interest_rate:
          type: string
          description: Fração mensal, não porcentagem. `"0.0200"` é 2% ao mês.
        issue_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        payment_date:
          type: [string, "null"]
          format: date
        status:
          $ref: '#/components/schemas/StatusDaCobranca'
        status_label:
          type: string
        is_overdue:
          type: boolean
          description: Derivado — pendente com vencimento no passado. Não existe como coluna.
        paid_amount:
          oneOf:
            - $ref: '#/components/schemas/Dinheiro'
            - type: "null"
          description: Congelado no ato do pagamento. Nulo enquanto pendente.
        paid_interest_amount:
          oneOf:
            - $ref: '#/components/schemas/Dinheiro'
            - type: "null"
          description: Juros congelados na data do pagamento. Nulo enquanto pendente.
        interest_amount:
          $ref: '#/components/schemas/Dinheiro'
        updated_amount:
          $ref: '#/components/schemas/Dinheiro'
        customer:
          $ref: '#/components/schemas/Customer'

    BillingInput:
      type: object
      required: [customer_id, description, original_amount, monthly_interest_rate, issue_date, due_date]
      properties:
        customer_id:
          type: integer
        description:
          type: string
          maxLength: 255
        original_amount:
          type: number
          minimum: 0.01
          maximum: 9999999999.99
        monthly_interest_rate:
          type: number
          minimum: 0
          maximum: 9.9999
          description: Fração mensal. `0.02` é 2% ao mês.
        issue_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
          description: Não pode ser anterior à emissão.

    DashboardPeriod:
      type: object
      description: O mês corrente, recortado por vencimento.
      properties:
        label:
          type: string
          examples: ["Setembro de 2026"]
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        count:
          type: integer
        original_amount:
          $ref: '#/components/schemas/Dinheiro'
        received_amount:
          $ref: '#/components/schemas/Dinheiro'
          description: Soma das colunas congeladas no pagamento.
        pending_amount:
          $ref: '#/components/schemas/Dinheiro'
          description: Valor ATUALIZADO do que não foi pago — já com juros.
        interest_amount:
          $ref: '#/components/schemas/Dinheiro'
          description: Juros acumulados pelas vencidas do mês, até hoje.
        overdue_count:
          type: integer

    DashboardMonth:
      type: object
      properties:
        month:
          type: string
          examples: ["2026-09"]
        label:
          type: string
          description: Rótulo curto, para caber sob a coluna do gráfico.
          examples: ["set/26"]
        count:
          type: integer
        original_amount:
          $ref: '#/components/schemas/Dinheiro'
        received_amount:
          $ref: '#/components/schemas/Dinheiro'

    RelatorioDeImportacao:
      type: object
      description: |
        O que aconteceu com o arquivo. Existe nesta forma porque importação
        parcial só é aceitável se o usuário souber o que entrou e o que não
        entrou — um contador de sucesso sozinho esconde a metade que importa.
      properties:
        total_rows:
          type: integer
          description: Linhas de dado, sem contar o cabeçalho.
        valid_count:
          type: integer
        imported_count:
          type: integer
          description: Sempre 0 na prévia.
        error_count:
          type: integer
        errors_truncated:
          type: boolean
          description: |
            A lista de erros tem teto de 50; a contagem não. Um arquivo com
            cabeçalho torto geraria um erro por linha, e devolver cem mil não
            ajudaria ninguém.
        errors:
          type: array
          items:
            type: object
            properties:
              line:
                type: integer
                description: Linha do arquivo, contando o cabeçalho.
              messages:
                type: array
                items:
                  type: string
              values:
                type: object
                additionalProperties:
                  type: string
                description: A linha como veio, para o usuário se reconhecer.
        sample:
          type: array
          description: Primeiras linhas válidas, já normalizadas.
          items:
            type: object
            additionalProperties:
              type: string

    Totais:
      type: object
      description: |
        Agregação sobre o conjunto filtrado inteiro, de consulta própria — nunca
        a soma da página exibida.
      properties:
        count:
          type: integer
        original_amount:
          $ref: '#/components/schemas/Dinheiro'
        interest_amount:
          $ref: '#/components/schemas/Dinheiro'
        updated_amount:
          $ref: '#/components/schemas/Dinheiro'
        paid_amount:
          $ref: '#/components/schemas/Dinheiro'
          description: Soma das colunas congeladas das cobranças pagas.
        pending_amount:
          $ref: '#/components/schemas/Dinheiro'
          description: Soma do valor atualizado das não pagas.

    Filtros:
      type: object
      description: Eco do recorte aplicado, já normalizado.
      properties:
        date_field:
          type: string
        start_date:
          type: [string, "null"]
        end_date:
          type: [string, "null"]
        customer_id:
          type: [integer, "null"]
        status:
          type: [string, "null"]
        sort:
          type: string
        direction:
          type: string

    Paginacao:
      type: object
      description: Envelope de paginação do Laravel.
      properties:
        links:
          type: object
          properties:
            first:
              type: [string, "null"]
            last:
              type: [string, "null"]
            prev:
              type: [string, "null"]
            next:
              type: [string, "null"]
        meta:
          type: object
          properties:
            current_page:
              type: integer
            from:
              type: [integer, "null"]
            last_page:
              type: integer
            path:
              type: string
            per_page:
              type: integer
            to:
              type: [integer, "null"]
            total:
              type: integer
