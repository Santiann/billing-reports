name: billing-reports

# Service naming — a deliberate decision, see the README:
#
#   backend  = nginx  (it is what answers HTTP)
#   php      = php-fpm (speaks FastCGI on 9000, not HTTP)
#
# CLAUDE.md pins API_URL_INTERNAL=http://backend for Server Components. If
# "backend" were php-fpm, that fetch would fail — php-fpm does not serve HTTP.
# Calling nginx "backend" keeps that contract literally true.

services:
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 1 GB holds the whole billings table with its 2 million rows — 177 MB of
      # data and 400 MB of indexes — and not only the part the report touches. At
      # the 128 MB default, a one-year aggregation re-read 114 thousand pages from
      # disk per run; from 512 MB upwards, none. The full measurement is in
      # docs/performance.md.
      - --innodb-buffer-pool-size=1G
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: billing
      MYSQL_USER: billing
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
      # Creates the test suite's database on first init. It only runs with an
      # empty datadir — on an existing volume, apply the .sql by hand.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    # MySQL 8's first init creates the datadir from scratch and, on a slow disk
    # (WSL2/virtiofs), it is lengthy and varies: from 3min52s to 10min20s measured
    # on this machine, from "Initializing database files" to "ready for
    # connections" on 3306. Hence the 900s window — 600s once failed by 20 seconds
    # here.
    #
    # Failures inside the start_period do not consume retries, so the wide window
    # costs nothing on subsequent boots: with the volume already populated the
    # healthcheck passes on the first probe.
    #
    # The probe goes over TCP on purpose. During the init MySQL brings up a
    # temporary server with `port: 0`, with no networking — a socket probe would
    # say "ready" too early and the backend would try to migrate against a
    # database that still lacks the application's user.
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent
      start_period: 900s
      start_interval: 5s
      interval: 10s
      timeout: 10s
      retries: 10

  php:
    build:
      context: ./backend
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    environment:
      # Inside the Compose network Next talks to nginx by service name.
      API_URL_INTERNAL: http://backend
      # In the browser, through the port published on the host.
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      # node_modules and .next live in anonymous volumes: the bind mount above
      # would hide the container's copies, and the host's native binaries
      # (@next/swc, lightningcss) are not Alpine's.
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  # End-to-end tests. A profile of its own on purpose: `docker compose up -d`
  # does not start this service, which runs to completion rather than staying up.
  #
  # The image is Playwright's official one, with the browsers already installed.
  # Playwright cannot run on the frontend's image: that one is Alpine, and the
  # browsers the project ships are compiled against glibc.
  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /app
    environment:
      # Inside the Compose network the application answers by service name.
      # From outside, it would be http://localhost:3000.
      E2E_BASE_URL: http://frontend:3000
    volumes:
      - ./frontend:/app
      # node_modules in a named volume, for the same reason as the frontend
      # service: the bind mount above would hide the container's copies, and a
      # native binary compiled for Alpine is no use here.
      - e2e_node_modules:/app/node_modules
    # Installs on the first run and reuses it on subsequent ones.
    command: >-
      sh -lc "[ -x node_modules/.bin/playwright ] || npm ci --no-audit --no-fund;
              npx playwright test"
    depends_on:
      - frontend
      - backend

volumes:
  mysql_data:
  e2e_node_modules:
