# Continuous integration: the same checks `make lint` and `make test` run
# locally, on every push.
#
# Two jobs in parallel, because the backend and the frontend do not depend on
# each other to be checked — and because this way the typecheck does not wait
# out the suite's minutes to fail.
name: CI

# `push` covers the everyday case: the workflow runs on the branch being worked
# on. `pull_request` covers the check from the base repository, for a PR that
# arrives from elsewhere.
on:
  push:
  pull_request:

# A new push on the same ref cancels the previous run: its result no longer
# describes the current code.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read only. Nothing here writes to the repository, and defaulting to a token
# with write access is surface this workflow does not need.
permissions:
  contents: read

jobs:
  backend:
    name: Backend — Pint e suíte
    runs-on: ubuntu-latest

    # The suite runs on MySQL on purpose (see the README): the project's central
    # rule is that the updated value be computable in SQL, and the consistency
    # test compares the calculation's SQL face against its PHP face. On SQLite it
    # would be validating a different engine.
    #
    # The database name and the credentials are the ones phpunit.xml expects.
    # `MYSQL_DATABASE` creates the database on first boot, which removes the need
    # here for the init script Compose uses.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: billing_test
          MYSQL_USER: billing
          MYSQL_PASSWORD: secret
        # The job runs on the runner, not inside a container, so the port has to
        # be published: the `mysql` label only resolves between containers on the
        # same Docker network.
        ports:
          - 3306:3306
        # Without a healthcheck, the first step would try to connect before MySQL
        # finished its init.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      # This variable WINS over phpunit.xml's `<env name="DB_HOST" value="mysql"/>`,
      # because PHPUnit does not overwrite an environment variable that already
      # exists — only with `force="true"`. Checked on this installation before
      # writing the workflow rather than assumed: with the variable present, the
      # suite tried 127.0.0.1 and the connection error named the host.
      DB_HOST: 127.0.0.1

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # The same extensions the Dockerfile compiles. `pcov` is left out:
          # coverage is not measured here, and it instruments the code.
          extensions: pdo_mysql, bcmath
          coverage: none

      # The cache directory comes from Composer itself, rather than a guessed
      # path: it changes with the platform and with the version.
      - name: Onde o Composer guarda cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache do Composer
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Dependências
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: .env e APP_KEY
        # The .env is gitignored, as in any Laravel. The container's entrypoint
        # does this on start-up; here it is the same step, made explicit.
        run: |
          cp .env.example .env
          php artisan key:generate

      # Pint before the suite: it takes seconds, the suite takes minutes, and
      # discovering wrong formatting after waiting out the suite is waste.
      - name: Pint
        run: ./vendor/bin/pint --test

      - name: Suíte
        run: php artisan test

  frontend:
    name: Frontend — typecheck e ESLint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      # Node 22, the same version as the frontend's Dockerfile. The npm cache
      # comes from the action itself, which is what the documentation recommends
      # for a supported package manager.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` and not `npm install`: it installs exactly the lockfile and
      # fails if it diverges from package.json.
      - name: Dependências
        run: npm ci

      # Without this the typecheck fails on a clean checkout, and CI is what
      # surfaced it: Next GENERATES the route types — `LayoutProps`, `PageProps` —
      # into `.next/types`, and tsconfig includes them. Locally they already
      # existed, created by the development server; here there was nobody to
      # create them, and tsc could not find `LayoutProps`.
      #
      # `typegen` produces only the definitions, without the whole build.
      - name: Tipos de rota do Next
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint
