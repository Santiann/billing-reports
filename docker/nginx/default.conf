# Identificador de requisição, decidido na borda.
#
# `$request_id` é um id que o próprio nginx gera por requisição. Se o cliente
# já mandou um `X-Request-Id`, ele é preservado — quem correlaciona chamadas
# entre serviços é quem está mais acima na cadeia, e sobrescrever quebraria a
# ligação. O Laravel recebe esse valor, devolve no cabeçalho da resposta e o
# põe em toda linha de log.
map $http_x_request_id $request_id_final {
    default $http_x_request_id;
    ""      $request_id;
}

# O mesmo id no log de acesso do nginx, que é o que permite casar uma linha
# daqui com as linhas da aplicação.
log_format com_request_id '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'req_id=$request_id_final rt=$request_time';

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20m;

    access_log /var/log/nginx/access.log com_request_id;

    # Exportação de CSV é StreamedResponse: o buffer do nginx seguraria o
    # arquivo inteiro antes de mandar a primeira linha, que é exatamente o que
    # a estratégia de streaming existe para evitar.
    fastcgi_buffering off;
    proxy_buffering off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # "php" é o serviço php-fpm. Este container nginx é que se chama
        # "backend" no compose — ver o comentário no docker-compose.yml.
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Chega no Laravel como o cabeçalho X-Request-Id.
        fastcgi_param HTTP_X_REQUEST_ID $request_id_final;
        # Exportações grandes podem passar do default de 60s.
        fastcgi_read_timeout 300;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
