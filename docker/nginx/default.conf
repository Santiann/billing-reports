server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20m;

    # Exportação de CSV é StreamedResponse: o buffer do nginx seguraria o
    # arquivo inteiro antes de mandar a primeira linha, que é exatamente o que
    # a estratégia de streaming existe para evitar.
    fastcgi_buffering off;
    proxy_buffering off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # "php" é o serviço php-fpm. Este container nginx é que se chama
        # "backend" no compose — ver o comentário no docker-compose.yml.
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Exportações grandes podem passar do default de 60s.
        fastcgi_read_timeout 300;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
